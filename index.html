<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 · 课题组科研与学生培养管理平台</title>
  <link rel="stylesheet" href="assets/css/style.css?v=3.7">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <!-- 欢迎区：课题组合照轮播背景（照片按原比例完整显示不裁切，模糊放大版填充背景） -->
    <section class="hero-slideshow" id="heroSlideshow">
      <img class="hs-backdrop" id="hsBackdropImg" src="" alt="">
      <div class="hs-mask"></div>
      <img class="hs-photo" id="hsPhotoImg" src="" alt="课题组合影" title="点击照片可放大查看">
      <div class="hs-text">
        <h1>欢迎进入课题组科研与学生培养管理平台</h1>
        <p>这里集中管理项目、实验、样品、数据、报账、组会、学生培养与研究成果。信息找得到、过程可追踪、经验能继承、资源可共享。</p>
      </div>
      <div class="hs-cap" id="hsCaption"></div>
      <div class="hs-dots" id="hsDots"></div>
    </section>

    <!-- 8 个常用入口卡片 -->
    <div class="section-title">常用入口</div>
    <div class="grid grid-3" id="entry-cards"><!-- JS 渲染 --></div>

    <!-- 下方四块 -->
    <div class="grid grid-2" style="margin-top:34px;">
      <div>
        <div class="section-title">最近更新</div>
        <div class="card"><ul class="mini-list" id="recent-updates"></ul></div>
      </div>
      <div>
        <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>近期提醒 <span style="font-size:12px; color:var(--muted); font-weight:400;">未来三周内的事项</span></span>
          <button class="btn btn-primary btn-sm" onclick="openRemindModal()">＋ 添加提醒</button>
        </div>
        <div class="card"><ul class="mini-list" id="weekly-reminders"></ul></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:18px;">
      <div>
        <div class="section-title">常用资源</div>
        <div class="card"><ul class="mini-list" id="common-resources"></ul></div>
      </div>
      <div>
        <div class="section-title">快速链接</div>
        <div class="card"><ul class="mini-list" id="quick-links"></ul></div>
      </div>
    </div>
  </main>

  <!-- 照片放大查看器（点击遮罩任意处关闭） -->
  <div class="lightbox" id="photoViewer" onclick="this.classList.remove('show')">
    <img id="photoViewerImg" src="" alt="课题组合照大图">
    <div class="lb-cap" id="photoViewerCap"></div>
  </div>

  <!-- 数据（第一版：本地示例数据，后续可替换为 API） -->
  <script src="assets/js/data/projects.js?v=3.7"></script>
  <script src="assets/js/data/methods.js?v=3.7"></script>
  <script src="assets/js/data/samples.js?v=3.7"></script>
  <script src="assets/js/data/datasets.js?v=3.7"></script>
  <script src="assets/js/data/expenses.js?v=3.7"></script>
  <script src="assets/js/data/meetings.js?v=3.7"></script>
  <script src="assets/js/data/students.js?v=3.7"></script>
  <script src="assets/js/data/members.js?v=3.7"></script>
  <script src="assets/js/data/resources.js?v=3.7"></script>
  <script src="assets/js/config.js?v=3.7"></script>
  <script src="assets/js/app.js?v=3.7"></script>
  <script src="assets/js/backend.js?v=3.7"></script>
  <script>
    injectHeader("首页");
    renderEntryCards();

    // 照片放大查看器（首页背景轮播里的照片点击后放大）
    function openPhotoViewer(src, cap){
      document.getElementById("photoViewerImg").src = src;
      document.getElementById("photoViewerCap").textContent = cap || "";
      document.getElementById("photoViewer").classList.add("show");
    }
    window.openPhotoViewer = openPhotoViewer;

    // 首页背景轮播：合照轮流做背景，照片本身完整显示（不裁切人脸），模糊放大版填充背景
    // 照片来源优先级：① 飞书同步生成的清单 assets/data/group-photos.json（启用自动同步后）
    //                 ② config.js 的 window.GROUP_PHOTOS（手工维护，兜底）
    var hsPhotos = (window.GROUP_PHOTOS || []).filter(function(p){ return p && p.src; });
    var hsIdx = 0, hsTimer = null;
    var hsBack = document.getElementById("hsBackdropImg");
    var hsFront = document.getElementById("hsPhotoImg");
    var hsCap = document.getElementById("hsCaption");

    function hsDotsHTML(){
      document.getElementById("hsDots").innerHTML = hsPhotos.map(function(p, i){
        return '<button class="hs-dot' + (i === hsIdx ? ' active' : '') + '" onclick="hsGo(' + i + ')" title="第 ' + (i + 1) + ' 张"></button>';
      }).join("");
    }
    function hsShow(i){
      if(!hsPhotos.length) return;
      hsIdx = (i + hsPhotos.length) % hsPhotos.length;
      var ph = hsPhotos[hsIdx];
      hsFront.classList.add("fading");
      var src = ph.src + (ph.v ? "?v=" + ph.v : "");   // v 用于同步后刷新缓存
      var pre = new Image();
      pre.onload = function(){                 // 先预载再切换，避免闪白
        hsBack.src = src;
        hsFront.src = src;
        hsFront.classList.remove("fading");
      };
      pre.onerror = function(){                // 该照片还没上传：自动跳到下一张
        hsFront.classList.remove("fading");
        if(hsPhotos.length > 1) hsShow(hsIdx + 1);
      };
      pre.src = src;
      hsCap.textContent = (ph.caption || "课题组合影") + " · 点击放大";
      hsDotsHTML();
    }
    function hsPlay(){
      clearInterval(hsTimer);
      if(hsPhotos.length > 1) hsTimer = setInterval(function(){ hsShow(hsIdx + 1); }, 5000);
    }
    function hsGo(i){ hsShow(i); hsPlay(); }
    window.hsGo = hsGo;

    var hsBox = document.getElementById("heroSlideshow");
    hsBox.addEventListener("mouseenter", function(){ clearInterval(hsTimer); });  // 鼠标悬停暂停
    hsBox.addEventListener("mouseleave", hsPlay);
    hsFront.addEventListener("click", function(){
      if(hsFront.naturalWidth === 0) return;   // 只放大真正加载成功的照片
      openPhotoViewer(hsFront.src, (hsPhotos[hsIdx] || {}).caption || "");
    });
    hsShow(0);
    hsPlay();

    // 若启用了飞书自动同步，用同步脚本生成的清单覆盖手工配置（无清单文件时静默忽略）
    fetch("assets/data/group-photos.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        var list = data && (data.photos || data);
        if(Array.isArray(list) && list.filter(function(p){ return p && p.src; }).length){
          hsPhotos = list.filter(function(p){ return p && p.src; });
          hsShow(0);
          hsPlay();
        }
      })
      .catch(function(){ /* 没有清单文件：继续用 config.js 的手工配置 */ });

    // 最近更新：合并会议/数据/项目，按日期取最新几条
    function renderUpdates(){
      var updates = [];
      (window.DATA.meetings||[]).forEach(m => updates.push({t:"组会："+m.topic, d:m.date, u:P()+"meetings.html"}));
      (window.DATA.datasets||[]).forEach(d => updates.push({t:"数据："+d.name, d:d.updated, u:P()+"datasets.html"}));
      (window.DATA.projects||[]).forEach(p => updates.push({t:"项目："+p.name, d:p.start, u:P()+"projects.html"}));
      updates.sort((a,b)=> (b.d||"").localeCompare(a.d||""));
      document.getElementById("recent-updates").innerHTML = updates.slice(0,6).map(u =>
        `<li><a class="t" href="${u.u}">${esc(u.t)}</a><span class="d">${esc(u.d)}</span></li>`).join("");
    }
    renderUpdates();

    /* ============================================================
     * 近期提醒 = 自动提醒 + 手动提醒（全组共享，云端实时）
     *   自动：未来 21 天内的组会（来自组会栏目，谁发布谁出现，无需额外操作）
     *   手动：任何人点「＋ 添加提醒」，保存后全组可见（截止日期、催办事项等）
     * ============================================================ */
    function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
    function addDaysStr(s, n){ var d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

    function allReminders(){
      var base = (window.DATA.reminders || []).slice();
      var locals = [];
      try { locals = JSON.parse(localStorage.getItem("remind-local") || "[]"); } catch(e){}
      locals.forEach(function(d){
        var i = base.findIndex(function(x){ return x.id === d.id; });
        if(i >= 0) base[i] = Object.assign({}, base[i], d); else base.push(d);
      });
      var dels = [];
      try { dels = JSON.parse(localStorage.getItem("remind-deleted") || "[]"); } catch(e){}
      return base.filter(function(x){ return dels.indexOf(x.id) < 0; });
    }

    function autoReminders(){
      var out = [];
      var today = todayStr(), limit = addDaysStr(today, 21);
      (window.DATA.meetings||[]).forEach(function(m){
        if(m.date && m.date >= today && m.date <= limit){
          out.push({ t: "🗓 组会：" + (m.topic||""), d: m.date, u: P()+"meetings.html", auto: true });
        }
      });
      return out;
    }

    function renderReminders(){
      var items = autoReminders();
      allReminders().forEach(function(r){
        items.push({ t: "📌 " + (r.title||""), d: r.date, u: r.link || "", auto: false, id: r.id, note: r.note });
      });
      items.sort(function(a,b){ return String(a.d||"9999").localeCompare(String(b.d||"9999")); });
      var box = document.getElementById("weekly-reminders");
      if(!items.length){
        box.innerHTML = '<li style="color:var(--muted);">暂无近期事项。点右上「＋ 添加提醒」，或到「组会」发布组会——未来的组会会自动出现在这里。</li>';
        return;
      }
      box.innerHTML = items.map(function(r){
        var del = (!r.auto && r.id)
          ? ` <button class="btn btn-xs btn-danger" style="margin-left:6px;" onclick="deleteRemind('${esc(r.id)}')" title="删除这条提醒">删</button>` : "";
        var main = r.u
          ? `<a class="t" href="${esc(r.u)}">${esc(r.t)}</a>`
          : `<span class="t">${esc(r.t)}</span>`;
        return `<li>${main}${del}<span class="d">${esc(r.d || "")}</span></li>`;
      }).join("");
    }
    renderReminders();

    /* 添加/删除提醒 */
    var remindModal = document.createElement("div");
    remindModal.id = "remindModal"; remindModal.className = "modal";
    remindModal.innerHTML = `<div class="modal-box" style="max-width:480px;">
      <div class="modal-head"><b>添加提醒（全组可见）</b><button class="btn btn-sm btn-outline" onclick="closeRemindModal()">关闭</button></div>
      <div class="modal-body">
        <label>事项名称 <span style="color:red">*</span></label>
        <input id="rmTitle" placeholder="如 赵磊 VIGS 载体构建截止 / 催交示范县数据">
        <label style="margin-top:10px;">日期 <span style="color:red">*</span></label>
        <input type="date" id="rmDate">
        <label style="margin-top:10px;">备注（选填）</label>
        <input id="rmNote" placeholder="补充说明">
        <label style="margin-top:10px;">相关链接（选填，如飞书文档）</label>
        <input id="rmLink" placeholder="https://…">
        <div style="margin-top:14px;">
          <button class="btn btn-primary" onclick="submitRemind()">保存</button>
          <button class="btn btn-outline" onclick="closeRemindModal()" style="margin-left:8px;">取消</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(remindModal);

    function openRemindModal(){
      document.getElementById("rmTitle").value = "";
      document.getElementById("rmDate").value = "";
      document.getElementById("rmNote").value = "";
      document.getElementById("rmLink").value = "";
      document.getElementById("remindModal").classList.add("open");
    }
    window.openRemindModal = openRemindModal;
    function closeRemindModal(){ document.getElementById("remindModal").classList.remove("open"); }
    window.closeRemindModal = closeRemindModal;

    function saveLocalRemind(r){
      var arr = [];
      try { arr = JSON.parse(localStorage.getItem("remind-local") || "[]"); } catch(e){}
      var i = arr.findIndex(function(x){ return x.id === r.id; });
      if(i >= 0) arr[i] = r; else arr.push(r);
      localStorage.setItem("remind-local", JSON.stringify(arr));
    }

    function submitRemind(){
      var title = document.getElementById("rmTitle").value.trim();
      var date = document.getElementById("rmDate").value.trim();
      if(!title){ alert("请填写事项名称"); return; }
      if(!date){ alert("请选择日期"); return; }
      var r = {
        id: "R-" + Date.now() + "-" + Math.floor(Math.random()*1000),
        title: title, date: date,
        note: document.getElementById("rmNote").value.trim(),
        link: document.getElementById("rmLink").value.trim(),
        source: "manual"
      };
      var finish = function(){
        var arr = window.DATA.reminders = window.DATA.reminders || [];
        var i = arr.findIndex(function(x){ return x.id === r.id; });
        if(i >= 0) arr[i] = Object.assign({}, arr[i], r); else arr.push(r);
        closeRemindModal(); renderReminders();
      };
      if(window.DB && DB.mode === "cloud"){
        DB.upsert("reminders", r).then(finish).catch(function(e){
          alert("云端保存失败：" + e.message + "，已暂存本机。");
          saveLocalRemind(r); finish();
        });
      } else { saveLocalRemind(r); finish(); }
    }
    window.submitRemind = submitRemind;

    function deleteRemind(id){
      if(!confirm("确定删除这条提醒吗？")) return;
      var doLocal = function(){
        window.DATA.reminders = (window.DATA.reminders||[]).filter(function(x){ return x.id !== id; });
        var arr = [];
        try { arr = JSON.parse(localStorage.getItem("remind-local") || "[]"); } catch(e){}
        localStorage.setItem("remind-local", JSON.stringify(arr.filter(function(x){ return x.id !== id; })));
        var dels = [];
        try { dels = JSON.parse(localStorage.getItem("remind-deleted") || "[]"); } catch(e){}
        if(dels.indexOf(id) < 0) dels.push(id);
        localStorage.setItem("remind-deleted", JSON.stringify(dels));
        renderReminders();
      };
      if(window.DB && DB.mode === "cloud"){
        DB.remove("reminders", id).then(doLocal).catch(function(e){ alert("云端删除失败：" + e.message); });
      } else { doLocal(); }
    }
    window.deleteRemind = deleteRemind;

    // 常用资源（取 5 星推荐的前几条）
    var res = (window.DATA.resources||[]).filter(function(r){ return (r.recommend.match(/★/g)||[]).length >= 5; }).slice(0,6);
    document.getElementById("common-resources").innerHTML = res.map(r =>
      `<li><a class="t" href="${esc(r.url)}" target="_blank">${esc(r.title)}</a><span class="d">${esc(r.category)}</span></li>`).join("");

    // 快速链接：读 config.js 的 window.QUICK_LINKS（想改就改那里，注释写得很清楚）
    var links = window.QUICK_LINKS || [];
    document.getElementById("quick-links").innerHTML = links.map(l =>
      `<li><a class="t" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a></li>`).join("");

    /* ---------- 云端接入：组会（自动提醒来源）+ 提醒 + 项目/数据（最近更新） ---------- */
    var __cloudReady = (window.DB ? DB.ready() : Promise.resolve("local"));
    __cloudReady.then(function(mode){
      if(mode !== "cloud") return;
      return Promise.all([
        DB.hydrate("meetings", "meetings"),
        DB.hydrate("reminders", "reminders"),
        DB.hydrate("projects", "projects"),
        DB.hydrate("datasets", "datasets")
      ]).then(function(){
        renderUpdates(); renderReminders();
      });
    }).catch(function(){});
  </script>
<script src="assets/js/gate.js?v=3.7"></script>
</body>
</html>
