<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成员 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="toolbar">
      <select id="role">
        <option value="">全部身份</option>
        <option>教师</option><option>博士后</option><option>博士生</option>
        <option>硕士生</option><option>本科生</option><option>已毕业成员</option>
      </select>
    </div>
    <div class="grid grid-3" id="list"></div>
  </main>

  <script src="../assets/js/data/members.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("成员");
    document.getElementById("head").innerHTML = pageHead(
      "成员信息", "组内成员概况、擅长技能、可互助内容与联系方式（联系方式等敏感信息未来需权限控制）。",
      [{name:"首页", url:"../index.html"}, {name:"成员"}]
    );

    function card(m){
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h3 style="font-size:17px; color:var(--primary-dark);">${esc(m.name)}</h3>
          ${badge(m.role)}
        </div>
        <dl class="kv" style="margin-top:8px;">
          <dt>入组时间</dt><dd>${esc(m.join)}</dd>
          <dt>研究方向</dt><dd>${esc(m.research)}</dd>
          <dt>当前项目</dt><dd>${esc(m.project)}</dd>
          <dt>擅长技能</dt><dd>${(m.skills||[]).map(esc).join("、")}</dd>
          <dt>可帮助</dt><dd>${esc(m.help)}</dd>
          <dt>联系方式</dt><dd>${esc(m.contact)}</dd>
          <dt>工位</dt><dd>${esc(m.seat)}</dd>
          <dt>当前状态</dt><dd>${esc(m.status)}</dd>
          ${m.after?`<dt>毕业去向</dt><dd>${esc(m.after)}</dd>`:""}
        </dl>
      </div>`;
    }
    function render(){
      var r = document.getElementById("role").value;
      var list = (window.DATA.members||[]).filter(m=> !r || m.role===r);
      document.getElementById("list").innerHTML = list.length ? list.map(card).join("") : emptyTip("没有匹配的成员");
    }
    document.getElementById("role").addEventListener("change", render);
    render();
  </script>
</body>
</html>
