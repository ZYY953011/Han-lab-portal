<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组会安排与记录 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="note-box" style="margin-bottom:14px;">💡 组会信息只保留最需要发布的内容：时间、地点、汇报人、汇报材料、发布时间和发布人。</div>

    <div class="card" style="margin-bottom:14px;">
      <div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <span id="form-title">添加组会</span>
        <button class="btn btn-outline btn-sm" onclick="exportLocalMeetings()">导出我添加的组会（JSON）</button>
      </div>
      <p style="font-size:13px; color:var(--muted); margin:0 0 10px;">填写时间、地点、汇报人和材料链接，保存后仅当前浏览器可见；点导出后交给管理员合并。</p>
      <div class="material-add-form" style="margin-bottom:8px;">
        <input type="date" id="mt-date" placeholder="日期">
        <input type="time" id="mt-time" placeholder="时间">
        <input type="text" id="mt-place" placeholder="地点">
        <input type="text" id="mt-reporter" placeholder="汇报人">
        <input type="date" id="mt-publishDate" placeholder="发布日期">
        <input type="text" id="mt-publisher" placeholder="发布人">
        <input type="hidden" id="mt-base-id" value="">
      </div>
      <div class="material-add-form" style="margin-bottom:8px;">
        <input type="text" id="mt-topic" placeholder="主题" style="flex:2;">
        <input type="text" id="mt-pptUrl" placeholder="PPT 链接" style="flex:1.5;">
        <input type="text" id="mt-docUrl" placeholder="文档/笔记链接" style="flex:1.5;">
        <button class="btn btn-primary btn-sm" id="mt-submit-btn" onclick="submitMeeting()">保存</button>
        <button class="btn btn-outline btn-sm" id="mt-cancel-btn" onclick="resetMeetingForm()" style="display:none;">取消</button>
        <input type="hidden" id="mt-idx" value="">
      </div>
    </div>

    <div class="section-title">组会日历（最近 / 即将）</div>
    <div class="card" id="cal"></div>

    <div class="section-title" style="margin-top:18px;">组会历史记录</div>
    <div class="table-wrap" style="margin-top:8px;">
      <table>
        <thead><tr><th>日期</th><th>时间</th><th>地点</th><th>汇报人</th><th>主题</th><th>发布人</th><th>操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <!-- 导出弹窗 -->
  <div class="modal" id="mtExportWrap">
    <div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本地添加的组会（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeMtExportBox()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">复制下方内容，交给管理员：把 <code>meetings</code> 数组里的内容（含新增/修改）贴入 <code>assets/js/data/meetings.js</code> 的 <code>window.DATA.meetings</code> 中（相同 id 覆盖），并从该数组中删除 <code>deleted</code> 里列出的 id，全组即可同步。</p>
        <textarea id="mtExportBox" rows="12" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>
  </div>

  <script src="../assets/js/data/meetings.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("组会");
    document.getElementById("head").innerHTML = pageHead(
      "组会安排与记录", "会议时间、地点、汇报人、汇报材料、发布时间和发布人。",
      [{name:"首页", url:"../index.html"}, {name:"组会安排与记录"}]
    );

    function getLocalMeetings(){
      try { var raw = localStorage.getItem("meeting-local"); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
    }
    function saveLocalMeetings(arr){
      localStorage.setItem("meeting-local", JSON.stringify(arr));
    }
    function getDeletedMeetings(){
      try { var raw = localStorage.getItem("meeting-deleted"); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
    }
    function saveDeletedMeetings(arr){
      localStorage.setItem("meeting-deleted", JSON.stringify(arr));
    }
    function allMeetings(){
      var deleted = getDeletedMeetings();
      var base = (window.DATA.meetings || []).slice().filter(function(b){ return deleted.indexOf(b.id) < 0; });
      getLocalMeetings().forEach(function(item, idx){
        var copy = Object.assign({}, item);
        copy.__localIdx = idx;
        // 如果本地项 id 与 base 重复，覆盖 base
        var found = base.findIndex(function(b){ return b.id === copy.id; });
        if(found >= 0){ base[found] = copy; }
        else { base.push(copy); }
      });
      return base;
    }

    var list = allMeetings().sort(function(a,b){ return b.date.localeCompare(a.date); });

    // 日历：按月分组列出
    document.getElementById("cal").innerHTML = list.map(function(m){
      return '<div style="display:flex; gap:14px; padding:10px 0; border-bottom:1px dashed var(--border);">' +
        '<div style="min-width:64px; text-align:center;">' +
          '<div style="font-size:22px; font-weight:700; color:var(--primary);">' + esc(m.date.slice(8)) + '</div>' +
          '<div style="font-size:12px; color:var(--muted);">' + esc(m.date.slice(0,7)) + '</div>' +
        '</div>' +
        '<div>' +
          '<div><b>' + esc(m.topic) + '</b> ｜ ' + esc(m.reporter) + ' 汇报</div>' +
          '<div style="font-size:13px; color:var(--muted);">' + esc(m.date) + ' ' + esc(m.time) + ' ｜ ' + esc(m.place) + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    // 历史列表
    document.getElementById("rows").innerHTML = list.map(function(m){
      var isLocal = (typeof m.__localIdx === 'number');
      var actions = '<button class="btn btn-sm" onclick="showDetail(\'' + esc(m.id) + '\')">查看</button>' +
                    ' <button class="btn btn-xs btn-outline" onclick="editMeetingById(\'' + esc(m.id) + '\')">编辑</button>' +
                    ' <button class="btn btn-xs btn-danger" onclick="deleteMeetingById(\'' + esc(m.id) + '\', ' + isLocal + ')">删除</button>';
      return '<tr>' +
        '<td>' + esc(m.date) + '</td>' +
        '<td>' + esc(m.time) + '</td>' +
        '<td>' + esc(m.place) + '</td>' +
        '<td>' + esc(m.reporter) + '</td>' +
        '<td><a href="#' + esc(m.id) + '" onclick="showDetail(\'' + esc(m.id) + '\')">' + esc(m.topic) + '</a></td>' +
        '<td>' + esc(m.publisher || "—") + '<br><span style="font-size:12px; color:var(--muted);">' + esc(m.publishDate || "") + '</span></td>' +
        '<td>' + actions + '</td>' +
      '</tr>';
    }).join("");

    // 详情弹层
    var box = document.createElement("div");
    box.id = "detailBox";
    document.querySelector(".container").appendChild(box);

    function showDetail(id){
      var m = allMeetings().find(function(x){ return x.id===id; });
      if(!m) return;
      var materials = [];
      if(m.pptUrl) materials.push('<a class="btn btn-sm btn-outline" href="' + esc(m.pptUrl) + '" target="_blank">📊 PPT</a>');
      if(m.docUrl) materials.push('<a class="btn btn-sm btn-outline" href="' + esc(m.docUrl) + '" target="_blank">📄 文档</a>');
      box.innerHTML = '<div class="card" style="margin-top:18px; border-color:var(--primary);">' +
        '<div class="section-title" style="margin-top:0;">' + esc(m.topic) + '</div>' +
        '<dl class="kv">' +
          '<dt>会议时间</dt><dd>' + esc(m.date) + ' ' + esc(m.time) + '</dd>' +
          '<dt>地点</dt><dd>' + esc(m.place) + '</dd>' +
          '<dt>汇报人</dt><dd>' + esc(m.reporter) + '</dd>' +
          '<dt>发布时间</dt><dd>' + esc(m.publishDate || "—") + '</dd>' +
          '<dt>发布人</dt><dd>' + esc(m.publisher || "—") + '</dd>' +
        '</dl>' +
        '<div style="margin:8px 0;">' + materials.join(" ") + '</div>' +
        '<p style="margin-top:10px;"><a class="btn btn-outline btn-sm" href="javascript:void(0)" onclick="document.getElementById(\'detailBox\').innerHTML=\'\'">收起</a></p>' +
      '</div>';
      box.scrollIntoView({behavior:"smooth"});
    }
    window.showDetail = showDetail;

    function submitMeeting(){
      var date = document.getElementById("mt-date").value.trim();
      var time = document.getElementById("mt-time").value.trim();
      var place = document.getElementById("mt-place").value.trim();
      var reporter = document.getElementById("mt-reporter").value.trim();
      var topic = document.getElementById("mt-topic").value.trim();
      var pptUrl = document.getElementById("mt-pptUrl").value.trim();
      var docUrl = document.getElementById("mt-docUrl").value.trim();
      var publishDate = document.getElementById("mt-publishDate").value.trim();
      var publisher = document.getElementById("mt-publisher").value.trim();
      var idx = document.getElementById("mt-idx").value.trim();
      var baseId = document.getElementById("mt-base-id").value.trim();

      if(!date){ alert("请填写日期"); return; }
      if(!time){ alert("请填写时间"); return; }
      if(!place){ alert("请填写地点"); return; }
      if(!reporter){ alert("请填写汇报人"); return; }
      if(!topic){ alert("请填写主题"); return; }

      var arr = getLocalMeetings();
      var id;
      if(idx !== ""){
        id = arr[parseInt(idx,10)] ? arr[parseInt(idx,10)].id : baseId || ("MT-" + date + "-" + reporter);
      } else if(baseId) {
        id = baseId;
      } else {
        id = "MT-" + date + "-" + reporter + "-" + Date.now();
      }
      var item = { id:id, date:date, time:time, place:place, reporter:reporter, topic:topic, pptUrl:pptUrl, docUrl:docUrl, publishDate:publishDate, publisher:publisher };

      if(idx !== ""){
        var i = parseInt(idx, 10);
        if(arr[i]) arr[i] = item;
      } else {
        arr.push(item);
      }
      saveLocalMeetings(arr);
      location.reload();
    }
    window.submitMeeting = submitMeeting;

    function deleteMeetingById(id, isLocal){
      if(!confirm("确定删除这条组会吗？删除后仅当前浏览器隐藏；如需全组同步，请点右上角「导出」并把结果发给管理员。")) return;
      if(isLocal){
        var arr = getLocalMeetings();
        var i = arr.findIndex(function(x){ return x.id === id; });
        if(i >= 0){ arr.splice(i, 1); saveLocalMeetings(arr); }
      } else {
        var del = getDeletedMeetings();
        if(del.indexOf(id) < 0){ del.push(id); saveDeletedMeetings(del); }
      }
      location.reload();
    }
    window.deleteMeetingById = deleteMeetingById;

    function editMeeting(idx){
      var arr = getLocalMeetings();
      var m = arr[idx];
      if(!m) return;
      fillMeetingForm(m, idx, "");
    }
    window.editMeeting = editMeeting;

    function editMeetingById(id){
      var m = allMeetings().find(function(x){ return x.id === id; });
      if(!m) return;
      if(typeof m.__localIdx === 'number'){
        editMeeting(m.__localIdx);
      } else {
        fillMeetingForm(m, "", m.id);
      }
    }
    window.editMeetingById = editMeetingById;

    function fillMeetingForm(m, idx, baseId){
      document.getElementById("mt-date").value = m.date || "";
      document.getElementById("mt-time").value = m.time || "";
      document.getElementById("mt-place").value = m.place || "";
      document.getElementById("mt-reporter").value = m.reporter || "";
      document.getElementById("mt-topic").value = m.topic || "";
      document.getElementById("mt-pptUrl").value = m.pptUrl || "";
      document.getElementById("mt-docUrl").value = m.docUrl || "";
      document.getElementById("mt-publishDate").value = m.publishDate || "";
      document.getElementById("mt-publisher").value = m.publisher || "";
      document.getElementById("mt-idx").value = idx;
      document.getElementById("mt-base-id").value = baseId;
      document.getElementById("mt-submit-btn").textContent = "更新";
      document.getElementById("mt-cancel-btn").style.display = "";
      document.getElementById("form-title").textContent = "编辑组会";
      document.getElementById("mt-date").focus();
    }

    function resetMeetingForm(){
      document.getElementById("mt-date").value = "";
      document.getElementById("mt-time").value = "";
      document.getElementById("mt-place").value = "";
      document.getElementById("mt-reporter").value = "";
      document.getElementById("mt-topic").value = "";
      document.getElementById("mt-pptUrl").value = "";
      document.getElementById("mt-docUrl").value = "";
      document.getElementById("mt-publishDate").value = "";
      document.getElementById("mt-publisher").value = "";
      document.getElementById("mt-idx").value = "";
      document.getElementById("mt-base-id").value = "";
      document.getElementById("mt-submit-btn").textContent = "保存";
      document.getElementById("mt-cancel-btn").style.display = "none";
      document.getElementById("form-title").textContent = "添加组会";
    }
    window.resetMeetingForm = resetMeetingForm;

    function exportLocalMeetings(){
      var arr = getLocalMeetings();
      var del = getDeletedMeetings();
      if(!arr.length && !del.length){ alert("当前浏览器没有临时添加或删除的组会"); return; }
      document.getElementById("mtExportBox").value = JSON.stringify({ meetings: arr, deleted: del }, null, 2);
      document.getElementById("mtExportWrap").classList.add("open");
      document.getElementById("mtExportBox").select();
    }
    window.exportLocalMeetings = exportLocalMeetings;

    function closeMtExportBox(){
      document.getElementById("mtExportWrap").classList.remove("open");
    }
    window.closeMtExportBox = closeMtExportBox;
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
