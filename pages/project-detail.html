<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container" id="main"></main>

  <script src="../assets/js/data/projects.js"></script>
  <script src="../assets/js/data/project-materials.js"></script>
  <script src="../assets/js/data/project-overrides.js"></script>
  <script src="../assets/js/data/methods.js"></script>
  <script src="../assets/js/data/samples.js"></script>
  <script src="../assets/js/data/datasets.js"></script>
  <script src="../assets/js/data/expenses.js"></script>
  <!-- window.DATA.achievements 定义在 members.js 中，此处加载以便「关联成果」正常显示 -->
  <script src="../assets/js/data/members.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/backend.js"></script>
  <script>
    injectHeader("项目");    var id = getParam("id");
    // 先合并本机通过「＋ 添加项目」弹窗临时保存的项目，否则这些项目点开详情会是空的
    if (typeof mergeLocalProjects === "function") mergeLocalProjects(window.DATA.projects || []);
    var p = (window.DATA.projects||[]).find(function(x){ return x.id===id; });
    // 回退：若传入的是本地草稿的旧 id（合并同名后已并入正式项目），按名称找回
    if(!p && typeof getLocalProjects === "function"){
      var draft = getLocalProjects().find(function(x){ return x.id===id; });
      if(draft){ p = (window.DATA.projects||[]).find(function(x){ return (x.name||"").trim()===(draft.name||"").trim(); }); }
    }
    var folderUrl = (p && p.projectFolderUrl) || window.PROJECT_MATERIALS_FOLDER || "";

    if(!p){
      document.getElementById("main").innerHTML =
        emptyTip("未找到该项目（id=" + esc(id) + "）。若它刚在本机「＋ 添加项目」弹窗里创建，请回项目列表点「导出我添加的项目（JSON）」交给管理员合并到全站数据。") +
        '<p style="text-align:center; margin-top:14px;"><a class="btn btn-outline btn-sm" href="projects.html">← 返回项目列表</a></p>';
    }
    else {
      var nameOf = function(key,arr,field){
        return (window.DATA[arr]||[]).filter(function(x){ return (p[key]||[]).indexOf(x.id)!==-1; }).map(function(x){ return x[field]; }).join("。") || "—";
      };

      function matKey(){ return "proj-materials-" + p.id; }
      function progressKey(){ return "proj-progress-" + p.id; }

      function getLocalMaterials(){
        try { var raw = localStorage.getItem(matKey()); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
      }
      function saveLocalMaterials(items){
        localStorage.setItem(matKey(), JSON.stringify(items));
      }
      function getLocalProgress(){
        try { var raw = localStorage.getItem(progressKey()); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
      }
      function saveLocalProgress(items){
        localStorage.setItem(progressKey(), JSON.stringify(items));
      }

      function allMaterials(){
        var list = (p.materials || []).slice();
        var locals = getLocalMaterials();
        locals.forEach(function(item, idx){
          var exists = list.some(function(m){ return m.name===item.name && m.date===item.date && m.uploader===item.uploader; });
          if(!exists){
            var copy = Object.assign({}, item);
            copy.__localIdx = idx;
            list.push(copy);
          }
        });
        return list.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
      }

      function nowISO(){ return new Date().toISOString(); }
      function formatDate(d){
        if(!d) return "—";
        if(/^\d{4}-\d{2}$/.test(d)) return d;
        var date = new Date(d);
        if(isNaN(date.getTime())) return d;
        return date.toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
      }
      function fileIcon(name){
        var n = (name||"").toLowerCase();
        if(/\.pdf$/.test(n)) return "📄";
        if(/\.(ppt|pptx)$/.test(n)) return "📊";
        if(/\.(doc|docx)$/.test(n)) return "📝";
        if(/\.(xls|xlsx|csv)$/.test(n)) return "📈";
        if(/\.(jpg|jpeg|png|gif)$/.test(n)) return "🖼️";
        return "📁";
      }

      function materialRow(m){
        var actions = '';
        if(typeof m.__localIdx === 'number'){
          actions = '<div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">' +
            '<button class="btn btn-xs btn-outline" onclick="editMat(' + m.__localIdx + ')">编辑</button>' +
            '<button class="btn btn-xs btn-danger" onclick="deleteMat(' + m.__localIdx + ')">删除</button>' +
            '</div>';
        }
        return '<tr>' +
          '<td><span class="mat-icon">' + fileIcon(m.name) + '</span><a class="mat-name" href="' + esc(m.url) + '" target="_blank" rel="noopener" title="' + esc(m.url) + '">' + esc(m.name || "未命名文件") + '</a></td>' +
          '<td>' + esc(m.uploader || "—") + '</td>' +
          '<td class="mat-time">' + esc(formatDate(m.date)) + '</td>' +
          '<td class="mat-note">' + esc(m.note || "") + '</td>' +
          '<td style="width:90px;">' + actions + '</td>' +
        '</tr>';
      }

      function renderMaterials(){
        var list = allMaterials();
        var hasFolder = folderUrl && folderUrl.indexOf("http") === 0;
        var uploadBtn = hasFolder
          ? '<a class="btn btn-primary btn-sm" href="' + esc(folderUrl) + '" target="_blank" rel="noopener">📤 上传到飞书资料夹 ↗</a>'
          : '<span class="btn btn-primary btn-sm disabled" style="opacity:.6; cursor:not-allowed;">📤 上传入口未配置</span>';

        var rows = list.length ? list.map(materialRow).join("") : '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:24px;">暂无资料，请在上方添加。</td></tr>';

        return '<div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
          '<span>项目资料</span>' +
          '<div style="display:flex; gap:8px;">' + uploadBtn +
            '<button class="btn btn-outline btn-sm" onclick="exportProjLocalMaterials()">导出我添加的资料（JSON）</button>' +
          '</div>' +
        '</div>' +
        '<p style="font-size:13px; color:var(--muted); margin:0 0 10px;">文件先传到飞书，再在这里粘贴链接、填写信息；保存后自动记录当前时间。</p>' +
        '<div class="material-add-form">' +
          '<input type="text" id="mat-name" placeholder="文件名称">' +
          '<input type="text" id="mat-uploader" placeholder="上传人">' +
          '<input type="text" id="mat-note" placeholder="备注">' +
          '<input type="text" id="mat-url" placeholder="粘贴飞书文件/文件夹链接">' +
          '<button class="btn btn-primary btn-sm" id="mat-submit-btn" onclick="submitMat()">保存</button>' +
          '<button class="btn btn-outline btn-sm" id="mat-cancel-btn" onclick="resetMatForm()" style="display:none;">取消</button>' +
          '<input type="hidden" id="mat-idx" value="">' +
        '</div>' +
        '<div class="table-wrap">' +
          '<table class="material-table">' +
            '<thead><tr><th>名称</th><th style="width:110px;">上传人</th><th style="width:130px;">更新时间</th><th style="min-width:140px;">备注</th><th style="width:90px;">操作</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>';
      }

      function renderProgress(){
        var history = getLocalProgress();
        var current = history.length ? history[0].content : (p.monthlyProgress || "");
        var histHtml = history.map(function(it){
          return '<div class="progress-item">' +
            '<div class="progress-head"><span class="progress-date">' + esc(formatDate(it.date)) + '</span>' +
            '<span class="progress-reporter">' + esc(it.reporter || "—") + '</span></div>' +
            '<div class="progress-body">' + esc(it.content) + '</div>' +
          '</div>';
        }).join("");
        return '<div style="font-size:13.5px; margin-bottom:10px;"><b>本月进展</b></div>' +
          '<textarea id="progressInput" rows="3" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; resize:vertical;">' + esc(current) + '</textarea>' +
          '<div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">' +
            '<input type="text" id="progressReporter" placeholder="填写人姓名" style="width:140px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">' +
            '<button class="btn btn-primary btn-sm" onclick="saveProjectProgress()">保存本月进展</button>' +
          '</div>' +
          '<div style="margin-top:12px;">' +
            (histHtml || '<div class="placeholder" style="font-size:13px;">暂无历史进展记录</div>') +
          '</div>';
      }

      /* ==========================================================
       * 经费使用台账（预算拆分 + 手动登记 + 定期对账，不联通财务系统）
       * 数据挂载在项目对象 p.funding = { asOf, remark, budget:[], expenses:[] }
       * 本机草稿：fund-budget-<id>（导师/助理编辑的预算）、fund-exp-<id>（大家登记的支出）
       * ========================================================== */
      var BUDGET_TPL = [
        { cat:"设备费", amount:"", can:"项目所需小型仪器设备、工具、电脑等购置/租赁/升级改造", cannot:"大型贵重仪器（须走学校采购招标流程）" },
        { cat:"材料费", amount:"", can:"试验耗材、药品试剂、生物炭/肥料等试验材料购置与加工", cannot:"与项目无关的通用办公用品、个人物品" },
        { cat:"测试化验加工费", amount:"", can:"样品检测、土壤/植物分析化验、委托外部测试与加工", cannot:"应由公共平台免费提供的服务" },
        { cat:"燃料动力费", amount:"", can:"田间试验及温室用水、电、燃气、燃油等", cannot:"个人生活用水用电" },
        { cat:"差旅/会议/国际合作交流费", amount:"", can:"学术会议注册、科研调研差旅、合作交流", cannot:"旅游性质支出、与项目无关人员的差旅" },
        { cat:"出版/文献/信息传播/知识产权事务费", amount:"", can:"论文版面费、专著出版费、专利申请与维持费、文献查阅费", cannot:"与项目无关的出版物费用" },
        { cat:"劳务费", amount:"", can:"参与项目的研究生、博士后、临时聘用人员劳务补助", cannot:"在职在编教师工资性支出" },
        { cat:"专家咨询费", amount:"", can:"临时聘请的咨询/评审专家劳务费", cannot:"本单位在职人员以专家名义领取" },
        { cat:"间接费用", amount:"", can:"由学校统筹（水电房租、绩效等），一般不能直接报账", cannot:"不得直接用于日常报销" }
      ];

      function fundBudgetKey(){ return "fund-budget-" + p.id; }
      function fundExpKey(){ return "fund-exp-" + p.id; }
      function getLocalBudget(){
        try { var raw = localStorage.getItem(fundBudgetKey()); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
      }
      function saveLocalBudget(obj){ localStorage.setItem(fundBudgetKey(), JSON.stringify(obj)); }
      function getLocalExp(){
        try { var raw = localStorage.getItem(fundExpKey()); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
      }
      function saveLocalExp(arr){ localStorage.setItem(fundExpKey(), JSON.stringify(arr)); }

      // 合并后的台账视图：本机预算草稿优先（预览未发布的修改），官方支出 + 本机支出合并
      function fundingData(){
        var local = getLocalBudget();
        var official = p.funding || {};
        var f = {
          asOf: local ? (local.asOf || "") : (official.asOf || ""),
          remark: local ? (local.remark || "") : (official.remark || ""),
          budget: (local && local.budget && local.budget.length) ? local.budget : (official.budget || []),
          expenses: (official.expenses ? official.expenses.slice() : [])
        };
        getLocalExp().forEach(function(e, idx){
          var c = Object.assign({}, e); c.__localIdx = idx; f.expenses.push(c);
        });
        f.expenses.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
        return f;
      }

      function w2(x){ var n = Number(x); return isNaN(n) ? "0.00" : n.toFixed(2); }
      function curDateStr(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

      /* 支出流水表（独立函数，便于无预算时也能渲染） */
      function renderExpenseTable(f){
        var expRows = f.expenses.length ? f.expenses.map(function(e){
          var actions = "";
          if(typeof e.__localIdx === 'number'){
            actions = '<button class="btn btn-xs btn-danger" onclick="deleteExp(' + e.__localIdx + ')">删除</button>';
          } else if(e.id){
            actions = '<button class="btn btn-xs btn-danger" onclick="deleteExpById(\'' + esc(e.id) + '\')">删除</button>';
          }
          return '<tr>' +
            '<td>' + esc(e.date || "—") + '</td>' +
            '<td>' + esc(e.cat || "—") + '</td>' +
            '<td>' + esc(e.item || "—") + '</td>' +
            '<td><b>' + w2(e.amount) + '</b></td>' +
            '<td>' + esc(e.person || "—") + '</td>' +
            '<td>' + (e.receipt ? '<a href="' + esc(e.receipt) + '" target="_blank" rel="noopener">凭证/材料 ↗</a>' : '—') + '</td>' +
            '<td>' + esc(e.note || "") + '</td>' +
            '<td style="white-space:nowrap;">' + (actions || '<span style="color:var(--muted); font-size:12px;">—</span>') + '</td>' +
          '</tr>';
        }).join("") : '<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:18px;">还没有登记支出。谁去报账谁登记，记一笔少一笔。</td></tr>';

        return '<div class="section-title" style="margin-top:0; font-size:15px;">支出流水（' + f.expenses.length + ' 笔）</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>日期</th><th>科目</th><th>事由</th><th>金额(万)</th><th>经办人</th><th>凭证/材料</th><th>备注</th><th style="width:70px;">操作</th></tr></thead>' +
              '<tbody>' + expRows + '</tbody>' +
            '</table>' +
          '</div>';
      }

      /* 支出登记表单（独立函数） */
      function renderExpenseForm(budget){
        var catOptions = (budget || []).map(function(b){ return '<option>' + esc(b.cat) + '</option>'; }).join("")
          || '<option>材料费</option><option>设备费</option><option>差旅/会议/国际合作交流费</option><option>劳务费</option><option>其他</option>';
        return '<div id="fundExpForm" style="margin-top:14px; background:var(--bg,#f7f8fa); border-radius:10px; padding:12px 14px;">' +
            '<div style="font-size:13.5px; margin-bottom:8px;"><b>登记一笔支出</b>' +
              (window.DB && DB.mode === "cloud"
                ? '<span style="color:#2e9e5b;">（云端实时：保存后全组即可见）</span>'
                : '（保存后仅本机可见，点「导出台账修改」交给管理员合并）') +
            '</div>' +
            '<div class="material-add-form" style="margin-bottom:6px;">' +
              '<input type="date" id="fe-date" style="max-width:150px;">' +
              '<select id="fe-cat" style="max-width:220px;">' + catOptions + '</select>' +
              '<input type="text" id="fe-item" placeholder="事由（买了什么 / 办了什么）" style="flex:2;">' +
              '<input type="number" id="fe-amount" placeholder="金额（万元）" step="0.01" min="0" style="max-width:130px;">' +
            '</div>' +
            '<div class="material-add-form" style="margin-bottom:0;">' +
              '<input type="text" id="fe-person" placeholder="经办人" style="max-width:120px;">' +
              '<input type="text" id="fe-receipt" placeholder="凭证/发票飞书链接（选填）" style="flex:1.5;">' +
              '<input type="text" id="fe-note" placeholder="备注（选填）" style="flex:1;">' +
              '<button class="btn btn-primary btn-sm" id="fe-submit" onclick="submitExp()">保存</button>' +
            '</div>' +
          '</div>';
      }
      window.renderExpenseTable = renderExpenseTable;

      function renderFunding(){
        var f = fundingData();
        var hasData = f.budget.length > 0;

        // 没有预算但有共享流水时，也要把流水显示出来（预算由管理员/导师补充）
        if(!hasData && f.expenses.length){
          var spentOnly = 0;
          f.expenses.forEach(function(e){ spentOnly += Number(e.amount)||0; });
          return '<div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
              '<span>经费使用台账 <span style="font-size:12px; color:var(--muted); font-weight:400;">单位：万元</span></span>' +
              '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
                '<a class="btn btn-primary btn-sm" href="#fundExpForm">登记一笔支出</a>' +
                '<button class="btn btn-outline btn-sm" onclick="initBudgetTpl()">初始化预算模板（国自然科目）</button>' +
                '<button class="btn btn-outline btn-sm" onclick="exportFunding()">导出台账修改（JSON）</button>' +
              '</div>' +
            '</div>' +
            '<div class="warn-box" style="margin:0 0 12px; font-size:13px;">' +
              '⚠️ 该项目<b>还没有预算科目</b>（无法计算剩余额度），下方是已登记的支出流水。' +
              '请导师或经费助理点「初始化预算模板」建立各科目额度与可报销范围。' +
            '</div>' +
            '<div style="display:flex; gap:16px; flex-wrap:wrap; margin:0 0 12px; font-size:13px;">' +
              '<span>已登记支出：<b>' + w2(spentOnly) + '</b> 万元</span>' +
              '<span>共 ' + f.expenses.length + ' 笔</span>' +
            '</div>' +
            renderExpenseTable(f) +
            renderExpenseForm([]);
        }

        if(!hasData){
          return '<div class="section-title" style="margin-top:0;">经费使用台账</div>' +
            '<div class="placeholder" style="text-align:left; line-height:2.1;">' +
            '本项目的经费台账还没有建立。本网站无法与学校财务处系统联通，采用<b>「预算拆分 + 手动登记 + 定期对账」</b>的准实时办法维护：<br>' +
            '① <b>建预算</b>（导师/经费助理，一次性）：点下方按钮按「国家自然科学基金」预算科目生成空预算表，填好各科目<b>额度、能报什么、不能报什么</b>；<br>' +
            '② <b>随手登记</b>（全组成员）：谁去报账，谁回来在下方「登记一笔支出」，台账即时更新；<br>' +
            '③ <b>月底对账</b>（经费助理，每月 5 分钟）：对照学校财务系统查一次各科目余额，改「数据截至」日期并修正差额——页面上的剩余金额就始终贴近实时，并注明以财务处为准。<br>' +
            '<div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">' +
            '<button class="btn btn-primary btn-sm" onclick="initBudgetTpl()">初始化预算模板（国自然科目）</button>' +
            '<button class="btn btn-outline btn-sm" onclick="initBudgetBlank()">从空白开始</button>' +
            '</div></div>';
        }

        // 按类目汇总支出
        var spentByCat = {};
        var spent = 0;
        f.expenses.forEach(function(e){
          var amt = Number(e.amount)||0;
          spent += amt;
          spentByCat[e.cat] = (spentByCat[e.cat]||0) + amt;
        });
        var total = 0;
        f.budget.forEach(function(b){ total += Number(b.amount)||0; });
        var remain = total - spent;
        var overCats = f.budget.filter(function(b){ var a=Number(b.amount)||0; return a>0 && (spentByCat[b.cat]||0) > a; }).length;

        var asOfWarn = '（网站不联通学校财务系统，剩余金额为手动登记结果，请以财务处查询为准' + (f.asOf ? '，数据截至 ' + esc(f.asOf) : '') + '）';

        // 预算类目表
        var budgetRows = f.budget.map(function(b){
          var amt = Number(b.amount)||0;
          var sp = spentByCat[b.cat]||0;
          var rm = amt - sp;
          var pct = amt > 0 ? Math.round(sp/amt*100) : 0;
          var pctBar = amt > 0
            ? '<div class="progress" style="width:110px; height:8px; display:inline-block; vertical-align:middle;"><span style="width:' + Math.min(100,pct) + '%;' + (pct>=100?'background:#c43d3d;':(pct>=80?'background:#b97400;':'')) + '"></span></div>' +
              '<span style="font-size:12px; color:' + (pct>=100?'#c43d3d':(pct>=80?'#b97400':'var(--muted)')) + ';"> ' + pct + '%' + (pct>=100?' 超支':'') + '</span>'
            : '<span style="color:var(--muted); font-size:12px;">未填额度</span>';
          var rmHtml = amt > 0

      document.getElementById("mat-name").value = item.name || "";
      document.getElementById("mat-url").value = item.url || "";
      document.getElementById("mat-uploader").value = (item.uploader === "—" ? "" : (item.uploader || ""));
      document.getElementById("mat-note").value = item.note || "";
      document.getElementById("mat-idx").value = idx;
      document.getElementById("mat-submit-btn").textContent = "更新";
      var cancel = document.getElementById("mat-cancel-btn");
      if(cancel) cancel.style.display = "";
      document.getElementById("mat-name").focus();
    }
    window.editMat = editMat;

    function resetMatForm(){
      document.getElementById("mat-name").value = "";
      document.getElementById("mat-url").value = "";
      document.getElementById("mat-uploader").value = "";
      document.getElementById("mat-note").value = "";
      document.getElementById("mat-idx").value = "";
      document.getElementById("mat-submit-btn").textContent = "保存";
      var cancel = document.getElementById("mat-cancel-btn");
      if(cancel) cancel.style.display = "none";
    }
    window.resetMatForm = resetMatForm;

    function saveProjectProgress(){
      var content = document.getElementById("progressInput").value.trim();
      var reporter = document.getElementById("progressReporter").value.trim();
      if(!content){ alert("请填写本月进展"); return; }
      var date = nowISO();
      var history = [];
      try { var raw = localStorage.getItem("proj-progress-" + p.id); if(raw) history = JSON.parse(raw); } catch(e){}
      var idx = history.findIndex(function(it){ return it.date && it.date.slice(0,7) === date.slice(0,7); });
      if(idx >= 0){ history[idx] = { date: date, content: content, reporter: reporter || "—" }; }
      else { history.unshift({ date: date, content: content, reporter: reporter || "—" }); }
      localStorage.setItem("proj-progress-" + p.id, JSON.stringify(history));
      alert("已保存本月进展（仅本机可见，管理员可导出 JSON 合并到全站）");
      location.reload();
    }
    window.saveProjectProgress = saveProjectProgress;

    function exportProjLocalMaterials(){
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("proj-materials-")===0){
          var id = k.replace("proj-materials-","");
          out[id] = JSON.parse(localStorage.getItem(k));
        }
      }
      if(!Object.keys(out).length){ alert("当前浏览器没有临时添加的项目资料"); return; }
      var json = JSON.stringify(out, null, 2);
      var wrap = document.getElementById("projExportWrap");
      var box = document.getElementById("projExportBox");
      if(!wrap || !box) return;
      box.value = json;
      wrap.classList.add("open");
      box.select();
    }
    window.exportProjLocalMaterials = exportProjLocalMaterials;

    function closeProjExportBox(){
      var wrap = document.getElementById("projExportWrap");
      if(wrap) wrap.classList.remove("open");
    }
    window.closeProjExportBox = closeProjExportBox;
  </script>
<script src="../assets/js/gate.js"></script>
</body>
