<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container" id="main"></main>

  <script src="../assets/js/data/projects.js"></script>
  <script src="../assets/js/data/project-materials.js"></script>
  <script src="../assets/js/data/project-overrides.js"></script>
  <script src="../assets/js/data/methods.js"></script>
  <script src="../assets/js/data/samples.js"></script>
  <script src="../assets/js/data/datasets.js"></script>
  <script src="../assets/js/data/expenses.js"></script>
  <!-- window.DATA.achievements 定义在 members.js 中，此处加载以便「关联成果」正常显示 -->
  <script src="../assets/js/data/members.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("项目");
    var id = getParam("id");
    var p = (window.DATA.projects||[]).find(function(x){ return x.id===id; });
    var categories = window.PROJECT_ARCHIVE_CATEGORIES || [];
    var folderUrl = (p && p.projectFolderUrl) || window.PROJECT_MATERIALS_FOLDER || "";

    if(!p){ document.getElementById("main").innerHTML = emptyTip("未找到该项目"); }
    else {
      var nameOf = function(key,arr,field){
        return (window.DATA[arr]||[]).filter(function(x){ return (p[key]||[]).indexOf(x.id)!==-1; }).map(function(x){ return x[field]; }).join("、") || "—";
      };

      // localStorage keys
      function matKey(){ return "proj-materials-" + p.id; }
      function progressKey(){ return "proj-progress-" + p.id; }

      function getLocalMaterials(){
        try { var raw = localStorage.getItem(matKey()); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
      }
      function saveLocalMaterials(items){
        localStorage.setItem(matKey(), JSON.stringify(items));
      }

      function getLocalProgress(){
        try { var raw = localStorage.getItem(progressKey()); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
      }
      function saveLocalProgress(items){
        localStorage.setItem(progressKey(), JSON.stringify(items));
      }

      function allMaterials(){
        var list = (p.materials || []).slice();
        var locals = getLocalMaterials();
        locals.forEach(function(item){
          var exists = list.some(function(m){ return m.name===item.name && m.category===item.category && m.date===item.date && m.uploader===item.uploader; });
          if(!exists) list.push(item);
        });
        return list.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
      }

      var catMap = {};
      categories.forEach(function(c){ catMap[c.key] = c.label; });
      function normalizeCategory(c){
        if(!c) return "experiment";
        var key = String(c).trim();
        if(catMap[key]) return key;
        var mapped = window.PROJECT_ARCHIVE_CATEGORY_MAP && window.PROJECT_ARCHIVE_CATEGORY_MAP[key];
        return mapped || "experiment";
      }

      function thisMonth(){
        return new Date().toISOString().slice(0,7);
      }

      // 已填写的资料行
      function fileItem(m){
        var nameHtml = m.url
          ? '<a class="file-name" href="' + esc(m.url) + '" target="_blank" rel="noopener" title="' + esc(m.url) + '">' + esc(m.name || "未命名文件") + '</a>'
          : '<span class="file-name disabled">' + esc(m.name || "未命名文件") + '</span>';
        return '<div class="file-row">' +
          '<div class="file-col file-col-name">' + nameHtml + '</div>' +
          '<div class="file-col file-col-note" title="' + esc(m.note || "") + '">' + esc(m.note || "—") + '</div>' +
          '<div class="file-col file-col-date">' + esc(m.date || "—") + '</div>' +
          '<div class="file-col file-col-uploader">' + esc(m.uploader || "—") + '</div>' +
          '<div class="file-col file-col-action">' +
            (m.url ? '<a class="btn btn-xs btn-outline feishu-btn" href="' + esc(m.url) + '" target="_blank" rel="noopener">打开 ↗</a>' : '<span class="file-no-link">未上传</span>') +
          '</div>' +
        '</div>';
      }

      // 内联添加表单
      function inlineAddForm(ckey){
        return '<div class="file-row file-row-form">' +
          '<div class="file-col file-col-name"><input type="text" id="mat-name-' + esc(ckey) + '" placeholder="文件名称"></div>' +
          '<div class="file-col file-col-note"><input type="text" id="mat-note-' + esc(ckey) + '" placeholder="备注"></div>' +
          '<div class="file-col file-col-date"><input type="text" id="mat-date-' + esc(ckey) + '" value="' + esc(thisMonth()) + '" readonly title="自动填充本月"></div>' +
          '<div class="file-col file-col-uploader"><input type="text" id="mat-uploader-' + esc(ckey) + '" placeholder="上传人"></div>' +
          '<div class="file-col file-col-action"><button class="btn btn-xs btn-primary" onclick="submitInlineMat(\'' + esc(ckey) + '\')">保存</button></div>' +
        '</div>' +
        '<div class="file-row file-row-form" style="border-top:none; padding-top:0;">' +
          '<div style="flex:1; min-width:200px;"><input type="text" id="mat-url-' + esc(ckey) + '" placeholder="粘贴飞书文件/文件夹链接" style="width:100%;"></div>' +
        '</div>';
      }

      function renderArchive(){
        var list = allMaterials();
        var byCat = {};
        categories.forEach(function(c){ byCat[c.key] = []; });
        list.forEach(function(m){
          var key = normalizeCategory(m.category);
          if(!byCat[key]) byCat[key] = [];
          byCat[key].push(m);
        });

        var hasFolder = folderUrl && folderUrl.indexOf("http") === 0;
        var uploadBtnText = (p.projectFolderUrl && p.projectFolderUrl.indexOf("http")===0)
          ? "📤 上传到本项目飞书文件夹 ↗"
          : "📤 上传到总资料夹（按“项目名”建子文件夹）↗";
        var uploadBtn = hasFolder
          ? '<a class="btn btn-primary" href="' + esc(folderUrl) + '" target="_blank" rel="noopener">' + uploadBtnText + '</a>'
          : '<span class="btn btn-primary disabled" style="opacity:.6; cursor:not-allowed;">📤 上传入口未配置</span>';

        var html = '<div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
          '<div>' +
            '<div class="section-title" style="margin:0;">项目档案与资料库</div>' +
            '<div style="font-size:13px; color:var(--muted); margin-top:4px;">在每个分类下粘贴飞书链接、填写上传人和备注，日期自动填充本月。</div>' +
          '</div>' +
          '<div style="display:flex; gap:8px; flex-wrap:wrap;">' + uploadBtn +
            '<button class="btn btn-outline" onclick="exportProjLocalMaterials()">导出我添加的资料（JSON）</button>' +
          '</div>' +
        '</div>' +
        '<div class="help-hint" onclick="this.classList.toggle(\'open\')">' +
          '<span class="help-icon">?</span>' +
          '<span class="help-title">使用说明</span>' +
          '<div class="help-body">① 点上方「上传到…飞书文件夹」把文件放到飞书；② 在下方分类里粘贴链接、填上传人/备注，点保存；③ 管理员点「导出」把 JSON 贴入 <code>assets/js/data/project-materials.js</code>，全组可见。所有输入默认只保存在当前浏览器。</div>' +
        '</div>';

        categories.forEach(function(c){
          var items = byCat[c.key] || [];
          var fileList = items.map(fileItem).join("");
          html += '<details class="archive-details" open>' +
            '<summary class="archive-summary">' +
              '<span><span class="cat-label cat-' + esc(c.key) + '">' + esc(c.label) + '</span>' +
              '<span style="font-size:13px; color:var(--muted); margin-left:8px;">' + esc(c.desc) + '</span></span>' +
              '<span style="display:flex; gap:6px; align-items:center;">' +
                '<span class="badge badge-light">' + items.length + ' 份</span>' +
                (hasFolder?'<a class="btn btn-sm btn-outline feishu-btn" href="' + esc(folderUrl) + '" target="_blank" rel="noopener">📤 去飞书上传</a>':'') +
              '</span>' +
            '</summary>' +
            '<div class="archive-body">' +
              inlineAddForm(c.key) +
              (items.length ? '<div class="file-list" style="margin-top:6px;">' + fileList + '</div>' : '') +
            '</div>' +
          '</details>';
        });

        return html;
      }

      function renderProgress(){
        var history = getLocalProgress();
        var current = history.length ? history[0].content : (p.monthlyProgress || "");
        var histHtml = history.map(function(it){
          return '<div class="progress-item">' +
            '<div class="progress-head"><span class="progress-date">' + esc(it.date) + '</span>' +
            '<span class="progress-reporter">' + esc(it.reporter || "—") + '</span></div>' +
            '<div class="progress-body">' + esc(it.content) + '</div>' +
          '</div>';
        }).join("");
        return '<div style="font-size:13.5px; margin-bottom:10px;"><b>本月进展</b></div>' +
          '<textarea id="progressInput" rows="4" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; resize:vertical;">' + esc(current) + '</textarea>' +
          '<div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">' +
            '<input type="text" id="progressReporter" placeholder="填写人姓名" style="width:140px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">' +
            '<button class="btn btn-primary btn-sm" onclick="saveProjectProgress()">保存本月进展</button>' +
          '</div>' +
          '<div style="margin-top:14px;">' +
            '<div style="font-size:13px; color:var(--muted); margin-bottom:6px;">历史进展记录</div>' +
            (histHtml || '<div class="placeholder">暂无历史进展记录</div>') +
          '</div>';
      }

      document.getElementById("main").innerHTML =
        '<div class="breadcrumb"><a href="../index.html">首页</a> / <a href="projects.html">项目管理</a> / 项目详情</div>' +
        '<div class="detail-head">' +
          '<h1>' + esc(p.name) + '</h1>' +
          '<div class="meta">' +
            '<span><b>负责人：</b>' + esc(p.leader) + '</span>' +
            '<span><b>周期：</b>' + esc(p.start) + ' ~ ' + esc(p.end) + '</span>' +
            '<span><b>当前进度：</b>' + p.progress + '%</span>' +
            '<span><b>阶段：</b>' + esc(p.stage) + '</span>' +
            badge(p.status) +
          '</div>' +
          '<div class="progress" style="margin-top:12px;"><span style="width:' + p.progress + '%"></span></div>' +
          '<div style="margin-top:10px;"><b>下一步：</b>' + esc(p.nextPlan) + '</div>' +
        '</div>' +

        '<div class="grid grid-2">' +
          '<div class="card">' +
            '<div class="section-title" style="margin-top:0;">基本信息</div>' +
            '<dl class="kv">' +
              '<dt>项目来源</dt><dd>' + esc(p.source) + '</dd>' +
              '<dt>项目编号</dt><dd>' + esc(p.code) + '</dd>' +
              '<dt>财务编号</dt><dd>' + esc(p.fiscalCode || "—") + '</dd>' +
              '<dt>参与成员</dt><dd>' + esc(p.members.join("、")) + '</dd>' +
              '<dt>经费</dt><dd>' + esc(p.budget) + '</dd>' +
              '<dt>项目目标</dt><dd>' + esc(p.goal) + '</dd>' +
              '<dt>项目资料夹</dt>' +
              '<dd>' + (folderUrl ? '<a href="' + esc(folderUrl) + '" target="_blank" rel="noopener">📁 去飞书项目资料夹 ↗</a>' : '<span style="color:var(--muted);">未配置</span>') + '</dd>' +
            '</dl>' +
          '</div>' +
          '<div class="card">' +
            '<div class="section-title" style="margin-top:0;">OKR / 进展 / 风险</div>' +
            '<div style="font-size:13.5px; margin-bottom:10px;"><b>OKR</b></div>' +
            '<ul style="margin-top:0; padding-left:18px; font-size:13.5px;">' + p.okr.map(function(o){ return '<li style="margin-bottom:6px;">' + esc(o) + '</li>'; }).join("") + '</ul>' +
            renderProgress() +
            '<div style="font-size:13.5px; margin:14px 0 6px;"><b>风险与问题</b></div>' +
            '<div class="warn-box" style="font-size:13.5px; margin:0;">' + esc(p.risks) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-top:16px;">' + renderArchive() + '</div>' +

        '<div class="card" style="margin-top:16px;">' +
          '<div class="section-title" style="margin-top:0;">关联信息</div>' +
          '<dl class="kv">' +
            '<dt>关联实验方法</dt><dd>' + nameOf("relatedMethods","methods","name") + ' <a class="btn btn-sm btn-outline" href="methods.html">去方法库</a></dd>' +
            '<dt>关联样品</dt><dd>' + nameOf("relatedSamples","samples","name") + ' <a class="btn btn-sm btn-outline" href="samples.html">去样品库</a></dd>' +
            '<dt>关联数据</dt><dd>' + nameOf("relatedDatasets","datasets","name") + ' <a class="btn btn-sm btn-outline" href="datasets.html">去数据</a></dd>' +
            '<dt>关联报账</dt><dd>' + (p.relatedExpenses||[]).map(function(e){ return esc(e); }).join("、") || "—" + ' <a class="btn btn-sm btn-outline" href="expenses.html">去报账</a></dd>' +
            '<dt>关联成果</dt><dd>' + nameOf("relatedAchievements","achievements","title") + ' <a class="btn btn-sm btn-outline" href="achievements.html">去成果</a></dd>' +
          '</dl>' +
        '</div>' +

        '<details class="card" style="margin-top:16px;">' +
          '<summary class="section-title" style="margin:0; cursor:pointer;">实验设置（展开查看）</summary>' +
          '<dl class="kv" style="margin-top:12px;">' +
            '<dt>初始实验设置</dt><dd>' + esc(p.setup||"尚未填写") + '</dd>' +
            '<dt>实验布置细节</dt><dd>' + esc(p.design||"尚未填写") + '</dd>' +
          '</dl>' +
        '</details>' +

        '<p style="margin-top:16px;"><a class="btn btn-outline btn-sm" href="projects.html">← 返回项目列表</a></p>';

      // 弹窗：导出 JSON
      var exportWrap = document.createElement("div");
      exportWrap.id = "projExportWrap";
      exportWrap.className = "modal";
      exportWrap.innerHTML = '<div class="modal-box" style="max-width:720px;">' +
        '<div class="modal-head"><b>导出本地添加的项目资料（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeProjExportBox()">关闭</button></div>' +
        '<div class="modal-body">' +
          '<p style="font-size:13px; color:var(--muted); margin-bottom:8px;">复制下方内容，交给管理员贴入 <code>assets/js/data/project-materials.js</code> 的 <code>projectMaterialOverrides</code> 中，全组即可看到。</p>' +
          '<textarea id="projExportBox" rows="12" style="width:100%; font-family:monospace; font-size:12px;"></textarea>' +
        '</div>' +
      '</div>';
      document.body.appendChild(exportWrap);
    }

    function submitInlineMat(ckey){
      var name = document.getElementById("mat-name-" + ckey).value.trim();
      var url = document.getElementById("mat-url-" + ckey).value.trim();
      var uploader = document.getElementById("mat-uploader-" + ckey).value.trim();
      var note = document.getElementById("mat-note-" + ckey).value.trim();
      var date = document.getElementById("mat-date-" + ckey).value.trim() || new Date().toISOString().slice(0,7);

      if(!url){ alert("请粘贴飞书链接"); return; }
      if(!name){ name = "未命名文件"; }

      var item = { name: name, category: ckey, url: url, uploader: uploader || "—", note: note, date: date };
      var arr = [];
      try { var raw = localStorage.getItem("proj-materials-" + p.id); if(raw) arr = JSON.parse(raw); } catch(e){}
      arr.push(item);
      localStorage.setItem("proj-materials-" + p.id, JSON.stringify(arr));
      location.reload();
    }
    window.submitInlineMat = submitInlineMat;

    function saveProjectProgress(){
      var content = document.getElementById("progressInput").value.trim();
      var reporter = document.getElementById("progressReporter").value.trim();
      if(!content){ alert("请填写本月进展"); return; }
      var date = new Date().toISOString().slice(0,7);
      var history = [];
      try { var raw = localStorage.getItem("proj-progress-" + p.id); if(raw) history = JSON.parse(raw); } catch(e){}
      // 如果本月已有记录，替换；否则插入最前
      var idx = history.findIndex(function(it){ return it.date === date; });
      if(idx >= 0){ history[idx] = { date: date, content: content, reporter: reporter || "—" }; }
      else { history.unshift({ date: date, content: content, reporter: reporter || "—" }); }
      localStorage.setItem("proj-progress-" + p.id, JSON.stringify(history));
      alert("已保存本月进展（仅本机可见，管理员可导出 JSON 合并到全站）");
      location.reload();
    }
    window.saveProjectProgress = saveProjectProgress;

    function exportProjLocalMaterials(){
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("proj-materials-")===0){
          var id = k.replace("proj-materials-","");
          out[id] = JSON.parse(localStorage.getItem(k));
        }
      }
      if(!Object.keys(out).length){ alert("当前浏览器没有临时添加的项目资料"); return; }
      var json = JSON.stringify(out, null, 2);
      var wrap = document.getElementById("projExportWrap");
      var box = document.getElementById("projExportBox");
      if(!wrap || !box) return;
      box.value = json;
      wrap.classList.add("open");
      box.select();
    }
    window.exportProjLocalMaterials = exportProjLocalMaterials;

    function closeProjExportBox(){
      var wrap = document.getElementById("projExportWrap");
      if(wrap) wrap.classList.remove("open");
    }
    window.closeProjExportBox = closeProjExportBox;
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
