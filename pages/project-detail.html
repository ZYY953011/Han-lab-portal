<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container" id="main"></main>

  <script src="../assets/js/data/projects.js"></script>
  <script src="../assets/js/data/methods.js"></script>
  <script src="../assets/js/data/samples.js"></script>
  <script src="../assets/js/data/datasets.js"></script>
  <script src="../assets/js/data/expenses.js"></script>
  <script src="../assets/js/data/achievements.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("项目");
    var id = getParam("id");
    var p = (window.DATA.projects||[]).find(x=>x.id===id);
    if(!p){ document.getElementById("main").innerHTML = emptyTip("未找到该项目"); }
    else {
      var nameOf = (key,arr,field)=> (window.DATA[arr]||[]).filter(x=> (p[key]||[]).includes(x.id)).map(x=>x[field]).join("、") || "—";
      document.getElementById("main").innerHTML = `
        <div class="breadcrumb"><a href="../index.html">首页</a> / <a href="projects.html">项目管理</a> / 项目详情</div>
        <div class="detail-head">
          <h1>${esc(p.name)}</h1>
          <div class="meta">
            <span><b>负责人：</b>${esc(p.leader)}</span>
            <span><b>周期：</b>${esc(p.start)} ~ ${esc(p.end)}</span>
            <span><b>当前进度：</b>${p.progress}%</span>
            <span><b>阶段：</b>${esc(p.stage)}</span>
            ${badge(p.status)}
          </div>
          <div class="progress" style="margin-top:12px;"><span style="width:${p.progress}%"></span></div>
          <div style="margin-top:10px;"><b>下一步：</b>${esc(p.nextPlan)}</div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="section-title" style="margin-top:0;">基本信息</div>
            <dl class="kv">
              <dt>项目来源</dt><dd>${esc(p.source)}</dd>
              <dt>项目编号</dt><dd>${esc(p.code)}</dd>
              <dt>参与成员</dt><dd>${esc(p.members.join("、"))}</dd>
              <dt>经费</dt><dd>${esc(p.budget)}</dd>
              <dt>项目目标</dt><dd>${esc(p.goal)}</dd>
            </dl>
          </div>
          <div class="card">
            <div class="section-title" style="margin-top:0;">OKR</div>
            <ul>${p.okr.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
            <div class="section-title">本月进展</div>
            <p>${esc(p.monthlyProgress)}</p>
            <div class="section-title">风险与问题</div>
            <div class="warn-box">${esc(p.risks)}</div>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;">关联信息</div>
          <dl class="kv">
            <dt>关联实验方法</dt><dd>${nameOf("relatedMethods","methods","name")} <a class="btn btn-sm btn-outline" href="methods.html">去方法库</a></dd>
            <dt>关联样品</dt><dd>${nameOf("relatedSamples","samples","name")} <a class="btn btn-sm btn-outline" href="samples.html">去样品库</a></dd>
            <dt>关联数据</dt><dd>${nameOf("relatedDatasets","datasets","name")} <a class="btn btn-sm btn-outline" href="datasets.html">去数据</a></dd>
            <dt>关联报账</dt><dd>${(p.relatedExpenses||[]).map(e=>esc(e)).join("、")||"—"} <a class="btn btn-sm btn-outline" href="expenses.html">去报账</a></dd>
            <dt>关联成果</dt><dd>${nameOf("relatedAchievements","achievements","title")} <a class="btn btn-sm btn-outline" href="achievements.html">去成果</a></dd>
          </dl>
        </div>
        <div class="card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;">实验设置与资料库</div>
          <dl class="kv">
            <dt>初始实验设置</dt><dd>${esc(p.setup||"尚未填写，可在 assets/js/data/projects.js 中补充")}</dd>
            <dt>实验布置细节</dt><dd>${esc(p.design||"尚未填写，可在 assets/js/data/projects.js 中补充")}</dd>
          </dl>
          <div class="section-title">实验资料（PPT / 文档等）</div>
          ${(p.materials&&p.materials.length) ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>资料名称</th><th>类型</th><th>日期</th><th>上传人</th><th>查看</th></tr></thead>
              <tbody>
                ${p.materials.map(m=>`<tr>
                  <td>${esc(m.name)}</td>
                  <td>${esc(m.type||"—")}</td>
                  <td>${esc(m.date||"—")}</td>
                  <td>${esc(m.uploader||"—")}</td>
                  <td>${m.url?`<a class="btn btn-sm btn-outline" href="${esc(m.url)}" target="_blank">📥 打开</a>`:'<span style="color:#999;">未上传</span>'}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
          ` : `<p class="placeholder">该项目暂无实验资料。</p>`}
          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <a class="btn btn-primary" href="${esc(window.PROJECT_MATERIALS_FOLDER||"#")}" target="_blank">📤 上传新资料（飞书云空间）</a>
            <a class="btn btn-outline" href="https://my.feishu.cn/wiki/PZoSwAUDqi7mVDk3V9ocaiTGnzf?table=tblNhs3TiapsXbHr&view=vewMnc0ole" target="_blank">📋 查看报账明细</a>
          </div>
          <p style="margin-top:10px; font-size:12.5px; color:#666;">
            📌 <b>使用流程</b>：① 点上面"上传新资料"跳到飞书文件夹 → 上传 PPT/文档；
            ② 把刚上传的文件信息（名称、类型、日期、上传人、链接）按格式登记到
            <code>assets/js/data/projects.js</code> 对应项目的 <code>materials</code> 数组里，
            网站项目页就能看到这条资料。后接手实验的人直接点"打开"查看。
          </p>
        </div>
        <p style="margin-top:16px;"><a class="btn btn-outline btn-sm" href="projects.html">← 返回项目列表</a></p>
      `;
    }
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
