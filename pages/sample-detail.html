<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>样品详情 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.9">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container" id="main"></main>

  <script src="../assets/js/data/samples.js?v=3.9"></script>
  <script src="../assets/js/config.js?v=3.9"></script>
  <script src="../assets/js/app.js?v=3.9"></script>
  <script src="../assets/js/backend.js?v=3.9"></script>
  <script>
    injectHeader("样品");
    var id = getParam("id");

    function allSamples(){
      var base = (window.DATA.samples || []).slice();
      var locals = [];
      try { locals = JSON.parse(localStorage.getItem("sample-local") || "[]"); } catch(e){}
      locals.forEach(function(d){
        var i = base.findIndex(function(x){ return x.id === d.id; });
        if(i >= 0) base[i] = Object.assign({}, base[i], d); else base.push(d);
      });
      var dels = [];
      try { dels = JSON.parse(localStorage.getItem("sample-deleted") || "[]"); } catch(e){}
      return base.filter(function(x){ return dels.indexOf(x.id) < 0; });
    }

    function render(){
      var s = allSamples().find(x=>x.id===id);
      var main = document.getElementById("main");
      if(!s){ main.innerHTML = emptyTip("未找到该样品"); return; }
      var total = Number(s.total) || 0;
      var remain = Number(s.remain) || 0;
      var ratio = total > 0 ? (remain/total*100).toFixed(0) : 0;
      var kvRow = function(dt, dd){ return dd ? `<dt>${dt}</dt><dd>${dd}</dd>` : ""; };
      main.innerHTML = `
        <div class="breadcrumb"><a href="../index.html">首页</a> / <a href="samples.html">样品管理</a> / 样品详情</div>
        <div class="detail-head">
          <h1>${esc(s.name)}</h1>
          <div class="meta">
            <span><b>类型：</b>${esc(s.type)}</span>
            <span><b>所属项目：</b>${esc(s.project)}</span>
            <span><b>负责人：</b>${esc(s.owner)}</span>
            ${badge(s.status)}
          </div>
          <div style="margin-top:10px;"><b>位置：</b>${esc(s.location || "—")}</div>
          <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
            <a class="btn btn-primary btn-sm" href="samples.html?edit=${esc(s.id)}">✏️ 编辑</a>
            <button class="btn btn-danger btn-sm" onclick="deleteThis()">🗑 删除</button>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px;">
          <div class="section-title" style="margin-top:0;">库存</div>
          <div style="display:flex; gap:30px; flex-wrap:wrap; align-items:center;">
            <div><div style="font-size:13px;color:var(--muted);">数量 / 总量</div>
              <div style="font-size:20px;font-weight:700;color:var(--primary);">${remain} / ${total} ${esc(s.unit)}</div></div>
            <div style="flex:1; min-width:220px;">
              <div class="progress"><span style="width:${ratio}%"></span></div>
              <div style="font-size:12px;color:var(--muted);margin-top:4px;">剩余 ${ratio}%</div>
            </div>
            <!-- 未来扫码入口预留 -->
            <button class="btn btn-outline" onclick="alert('二维码扫码功能将在后续版本接入（预留入口）。')">📷 扫码 / 二维码占位</button>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="section-title" style="margin-top:0;">位置信息</div>
            <dl class="kv">
              ${kvRow("楼栋", esc(s.building))}
              ${kvRow("房间", esc(s.room))}
              ${kvRow("冰箱/柜子", esc(s.fridge))}
              ${kvRow("层", esc(s.layer))}
              ${kvRow("盒号", esc(s.box))}
              ${kvRow("具体位置", esc(s.location))}
              ${kvRow("保存条件", esc(s.storage))}
            </dl>
          </div>
          <div class="card">
            <div class="section-title" style="margin-top:0;">来源与使用</div>
            <dl class="kv">
              ${kvRow("来源", esc(s.source))}
              ${kvRow("制备/采样日期", esc(s.prepDate))}
              ${kvRow("最近使用人", esc(s.lastUser))}
              ${kvRow("最近使用时间", esc(s.lastUse))}
              ${kvRow("备注", esc(s.remark))}
            </dl>
          </div>
        </div>
        <p style="margin-top:16px;"><a class="btn btn-outline btn-sm" href="samples.html">← 返回样品列表</a></p>
      `;
    }
    render();

    function deleteThis(){
      if(!confirm("确定删除该样品吗？")) return;
      var go = function(){ location.href = "samples.html"; };
      if(window.DB && DB.mode === "cloud"){
        DB.remove("samples", id).then(go).catch(function(e){ alert("云端删除失败：" + e.message); });
      } else {
        var dels = [];
        try { dels = JSON.parse(localStorage.getItem("sample-deleted") || "[]"); } catch(e){}
        if(dels.indexOf(id) < 0) dels.push(id);
        localStorage.setItem("sample-deleted", JSON.stringify(dels));
        go();
      }
    }
    window.deleteThis = deleteThis;

    /* ---------- 云端接入 ---------- */
    var __cloudReady = (window.DB ? DB.ready() : Promise.resolve("local"));
    __cloudReady.then(function(mode){
      if(mode !== "cloud") return;
      return DB.hydrate("samples", "samples").then(function(){ render(); });
    }).catch(function(){});
  </script>
<script src="../assets/js/gate.js?v=3.9"></script>
</body>
</html>
