<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据管理 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="note-box" style="margin-bottom:14px;">
      💡 本网站第一版<b>不直接保存大型原始数据</b>，只保存“数据索引和链接”。点击按钮将跳转到学校服务器 / NAS / 云盘中的原始文件。
    </div>
    <div id="folders"></div>
    <div class="toolbar" style="margin-top:14px;">
      <input class="grow" id="kw" placeholder="搜索数据名称 / 项目 / 实验…">
      <select id="proj"></select>
    </div>
    <div id="list"></div>
  </main>

  <script src="../assets/js/data/datasets.js"></script>
  <script src="../assets/js/data/data-folders.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("数据");
    document.getElementById("head").innerHTML = pageHead(
      "数据管理", "只保存索引与链接，原始数据存放在服务器 / NAS / OneDrive / 对象存储。",
      [{name:"首页", url:"../index.html"}, {name:"数据管理"}]
    );

    /* ---------- 试验地云盘文件夹（权限由飞书控制，网站只放入口） ---------- */
    (function renderFolders(){
      var box = document.getElementById("folders");
      if(!areaUnlocked("dataFolders")){
        box.innerHTML = '<div class="card" style="margin-bottom:14px;">' +
          areaLockHtml("dataFolders", "试验地云盘文件夹", "dfPass", "dfErr",
            "每个试验地一个文件夹 → 按年份 → 按接收该试验的成员分子文件夹，<b>在飞书云盘里把文件夹共享给具体成员</b>即可精确到人、随时收回。") +
          '</div>';
        return;
      }
      var folders = window.DATA.dataFolders || [];
      if(!folders.length){ box.innerHTML = ""; return; }
      box.innerHTML = '<div class="card" style="margin-bottom:14px;">' +
        '<div class="section-title" style="margin-top:0;">试验地云盘文件夹 ' +
          '<span style="font-size:12px; color:var(--muted); font-weight:400;">🔒 权限由飞书云盘控制：谁被授权谁打得开</span></div>' +
        '<p style="font-size:12.5px; color:var(--muted); margin:0 0 10px;">' +
          '结构：<b>试验地 → 年份 → 成员子文件夹</b>。管理员在飞书云盘建好文件夹后，把链接填到 ' +
          '<code>assets/js/data/data-folders.js</code>，并把文件夹<b>共享给对应成员</b>；未授权的人点开会提示无权限。</p>' +
        folders.map(function(f){
          return '<div style="border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px;">' +
            '<div style="font-size:15px; font-weight:600; color:var(--primary-dark);">📍 ' + esc(f.site) + '</div>' +
            '<div style="font-size:12.5px; color:var(--muted); margin:4px 0 8px;">' + esc(f.note || "") + '</div>' +
            (f.years || []).map(function(y){
              return '<div style="margin-top:8px;">' +
                '<div style="font-size:13px; font-weight:600;">' + esc(y.year) + ' 年</div>' +
                '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;">' +
                  (y.members || []).map(function(m){
                    return m.url
                      ? '<a class="btn btn-sm btn-outline" href="' + esc(m.url) + '" target="_blank" rel="noopener">📁 ' + esc(m.name) + ' ↗</a>'
                      : '<span class="tag">📁 ' + esc(m.name) + '：链接待补' + (m.note ? '（' + esc(m.note) + '）' : '') + '</span>';
                  }).join("") +
                '</div>' +
              '</div>';
            }).join("") +
          '</div>';
        }).join("") +
      '</div>';
    })();

    var projs = [...new Set((window.DATA.datasets||[]).map(d=>d.project))];
    document.getElementById("proj").innerHTML = `<option value="">全部项目</option>` + projs.map(p=>`<option>${esc(p)}</option>`).join("");

    function linkBtn(label, url){
      return url ? `<a class="btn btn-sm btn-outline" href="${esc(url)}" target="_blank">${esc(label)} ↗</a>` : `<span class="tag">${esc(label)}：待补</span>`;
    }
    function card(d){
      return `<div class="card" style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h3 style="font-size:17px; color:var(--primary-dark);">${esc(d.name)}</h3>
          <span class="tag">${esc(d.project)}</span>
        </div>
        <div style="color:var(--muted); font-size:13px; margin:6px 0;">
          实验：${esc(d.experiment)} ｜ 日期：${esc(d.date)} ｜ 处理：${esc(d.treatment)} ｜ 重复：${esc(d.replicate)}
        </div>
        <div style="font-size:13.5px; color:#44505f;">测量变量：${esc(d.variables)} ｜ 操作者：${esc(d.operator)} ｜ 仪器：${esc(d.instrument)}</div>
        <div style="font-size:13px; color:var(--muted); margin:6px 0;">说明：${esc(d.note)}</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
          ${linkBtn("打开原始数据", d.raw_data_url)}
          ${linkBtn("打开清洗数据", d.clean_data_url)}
          ${linkBtn("打开分析文件", d.analysis_url)}
          ${linkBtn("查看图表", d.figure_url)}
        </div>
        <div style="margin-top:8px; font-size:12px; color:var(--muted);">
          版本 ${esc(d.version)} ｜ 更新 ${esc(d.updated)} ｜ 存储位置：${esc(d.storage_url)}
        </div>
      </div>`;
    }
    function render(){
      var kw = document.getElementById("kw").value.trim().toLowerCase();
      var proj = document.getElementById("proj").value;
      var list = (window.DATA.datasets||[]).filter(d=>{
        var ok1 = !kw || (d.name+d.project+d.experiment+d.variables).toLowerCase().includes(kw);
        var ok2 = !proj || d.project===proj;
        return ok1 && ok2;
      });
      document.getElementById("list").innerHTML = list.length ? list.map(card).join("") : emptyTip("没有匹配的数据");
    }
    document.getElementById("kw").addEventListener("input", render);
    document.getElementById("proj").addEventListener("change", render);
    render();
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
