<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究成果 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.9">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div id="dbBanner"></div>
    <!-- 成果统计栏：数字由下方脚本按数据自动汇总，改数据即自动更新 -->
    <div class="stat-row" id="stats" style="margin-top:4px;"></div>
    <p id="statNote" style="font-size:12.5px; color:var(--muted); margin:8px 0 0;"></p>
    <div class="toolbar">
      <select id="type"></select>
      <select id="year"></select>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-primary btn-sm" onclick="openAchvModal()">＋ 添加成果</button>
        <button class="btn btn-outline btn-sm local-only-btn" onclick="exportAchvLocal()">导出我添加的修改（JSON）</button>
      </div>
    </div>
    <p id="acHint" style="font-size:12.5px; color:var(--muted); margin:6px 0 0;">提示：添加/编辑/删除保存后全组实时可见（数据保存在云端）。</p>
    <div class="table-wrap" style="margin-top:8px;">
      <table>
        <thead><tr><th>类型</th><th>标题</th><th>作者</th><th>期刊/来源</th><th>年份</th><th>分区/IF</th><th>所属项目</th><th>链接</th><th style="width:110px;">操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/js/data/members.js?v=3.9"></script>
  <script src="../assets/js/data/achievement-overrides.js?v=3.9"></script>
  <script src="../assets/js/config.js?v=3.9"></script>
  <script src="../assets/js/app.js?v=3.9"></script>
  <script src="../assets/js/backend.js?v=3.9"></script>
  <script>
    injectHeader("成果");
    document.getElementById("head").insertAdjacentHTML("afterend",
      unpublishedBar(((window.getLocalItems && getLocalItems()) || []).length + ((window.getLocalDeleted && getLocalDeleted()) || []).length, "exportAchvLocal()"));
    document.getElementById("head").innerHTML = pageHead(
      "研究成果", "论文、专利、软著、获奖、基金等，支持按年份、类型筛选。获奖证书等证明文件因涉及隐私未公开上传，如需查看请联系获奖本人。",
      [{name:"首页", url:"../index.html"}, {name:"研究成果"}]
    );

    // 类型筛选下拉：固定基础类型（即使暂无数据也显示，便于录入前后筛选）+ 数据中实际出现的类型
    var baseTypes = ["期刊/会议论文","学位论文","获奖","专利","软著","专著","基金"];
    var types = [...new Set(baseTypes.concat((window.DATA.achievements||[]).map(a=>a.type).filter(Boolean)))];

    // ---------- 本机临时修改（云端未连接时的兜底，恢复后自动同步） ----------
    function getLocalItems(){ try{ return JSON.parse(localStorage.getItem("achv-items")||"[]"); }catch(e){ return []; } }
    function saveLocalItems(arr){ localStorage.setItem("achv-items", JSON.stringify(arr)); }
    function getLocalDeleted(){ try{ return JSON.parse(localStorage.getItem("achv-deleted")||"[]"); }catch(e){ return []; } }
    function saveLocalDeleted(arr){ localStorage.setItem("achv-deleted", JSON.stringify(arr)); }

    // 留存"全站原始数据"副本，用于区分"本机新增"与"修改官方条目"
    window.__officialAchv = (window.DATA.achievements||[]).slice();

    // 应用本机修改（须在统计与渲染前执行）
    (function applyLocal(){
      var list = window.DATA.achievements = window.DATA.achievements || [];
      getLocalItems().forEach(function(p){
        if(!p || !p.id) return;
        var i = list.findIndex(x=>x.id===p.id);
        if(i>=0) list[i] = Object.assign({}, list[i], p); else list.push(p);
      });
      var del = getLocalDeleted();
      if(del.length) window.DATA.achievements = list.filter(a=>del.indexOf(a.id)<0);
    })();

    function nextAchvId(){
      var max = 0;
      (window.DATA.achievements||[]).forEach(function(x){
        var m = /^([A-Za-z]+)(\d+)$/.exec(x.id||"");
        if(m && m[1]==="A") max = Math.max(max, parseInt(m[2],10));
      });
      return "A" + String(max+1).padStart(3,"0");
    }

    // ---------- 添加 / 编辑弹窗 ----------
    var achvModal = document.createElement("div");
    achvModal.id = "achvModal";
    achvModal.className = "modal";
    var typeOptions = [...new Set(baseTypes
      .concat((window.DATA.achievements||[]).map(a=>a.type).filter(Boolean)))];
    var memberOptions = (window.DATA.members||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.name)}（${esc(m.role||"")}）</option>`).join("");
    achvModal.innerHTML = `<div class="modal-box" style="max-width:640px;">
      <div class="modal-head"><b id="amTitle">添加成果</b><button class="btn btn-sm btn-outline" onclick="closeAchvModal()">关闭</button></div>
      <div class="modal-body">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div><label>类型 <span style="color:red">*</span></label>
            <select id="amType" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              ${typeOptions.map(t=>`<option>${esc(t)}</option>`).join("")}
            </select></div>
          <div><label>年份</label><input type="text" id="amYear" placeholder="如 2025"></div>
          <div style="grid-column:1/-1;"><label>标题 <span style="color:red">*</span></label><input type="text" id="amTitle2" placeholder="论文建议按 作者_期刊名_年份 填写，如 韩娟_Field Crops Research_2026"></div>
          <div><label>作者（多人用逗号分隔）</label><input type="text" id="amAuthors" placeholder="如 韩娟,张三"></div>
          <div><label>期刊/来源</label><input type="text" id="amJournal" placeholder="如 Field Crops Research"></div>
          <div><label>分区/IF</label><input type="text" id="amZone" placeholder="如 中科院一区 / IF=7.5"></div>
          <div><label>所属项目</label><input type="text" id="amProject" placeholder="如 P2（可在项目管理页查看编号）"></div>
          <div><label>语言（仅论文需要）</label>
            <select id="amLang" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option value="">自动判断（按期刊名）</option><option>SCI</option><option>中文</option>
            </select></div>
          <div><label>关联成员（显示在其成员卡片上）</label>
            <select id="amMember" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option value="">不关联</option>${memberOptions}
            </select></div>
          <div style="grid-column:1/-1;"><label>链接（飞书/期刊原文链接）</label><input type="text" id="amUrl" placeholder="https://…"></div>
          <div style="grid-column:1/-1;"><label>备注</label><input type="text" id="amNote" placeholder="选填"></div>
        </div>
        <div style="margin-top:14px;">
          <button class="btn btn-primary" onclick="submitAchv()">保存</button>
          <button class="btn btn-outline" onclick="closeAchvModal()" style="margin-left:8px;">取消</button>
        </div>
        <p id="amHint" style="font-size:12px; color:var(--muted); margin-top:10px;">保存后全组实时可见（云端）；若提示未连接云端，则暂存本机，恢复后刷新页面再保存一次即可同步全组。</p>
      </div>
    </div>`;
    document.body.appendChild(achvModal);

    function openAchvModal(id){
      document.getElementById("amTitle").textContent = id ? "编辑成果" : "添加成果";
      var a = id ? (window.DATA.achievements||[]).find(x=>x.id===id) : null;
      document.getElementById("amType").value = a ? (a.type||"期刊/会议论文") : "期刊/会议论文";
      document.getElementById("amTitle2").value = a ? (a.title||"") : "";
      document.getElementById("amAuthors").value = a ? (a.authors||[]).join(",") : "";
      document.getElementById("amJournal").value = a ? (a.journal||"") : "";
      document.getElementById("amYear").value = a ? (a.year||"") : "";
      document.getElementById("amZone").value = a ? (a.zone||"") : "";
      document.getElementById("amProject").value = a ? (a.project||"") : "";
      document.getElementById("amLang").value = a ? (a.lang||"") : "";
      document.getElementById("amMember").value = a ? (a.relatedMember||"") : "";
      document.getElementById("amUrl").value = a ? (a.url||"") : "";
      document.getElementById("amNote").value = a ? (a.note||"") : "";
      document.getElementById("achvModal").dataset.id = id || "";
      document.getElementById("achvModal").classList.add("open");
    }
    window.openAchvModal = openAchvModal;

    function closeAchvModal(){
      document.getElementById("achvModal").classList.remove("open");
    }
    window.closeAchvModal = closeAchvModal;

    function submitAchv(){
      var id = document.getElementById("achvModal").dataset.id;
      var type = document.getElementById("amType").value.trim();
      var title = document.getElementById("amTitle2").value.trim();
      if(!title){ alert("请填写标题"); return; }
      var authors = document.getElementById("amAuthors").value.trim()
        .split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
      var obj = {
        id: id || nextAchvId(),
        type: type,
        title: title,
        authors: authors,
        journal: document.getElementById("amJournal").value.trim(),
        year: document.getElementById("amYear").value.trim(),
        zone: document.getElementById("amZone").value.trim(),
        project: document.getElementById("amProject").value.trim(),
        lang: document.getElementById("amLang").value,
        relatedMember: document.getElementById("amMember").value,
        url: document.getElementById("amUrl").value.trim(),
        note: document.getElementById("amNote").value.trim()
      };
      /* 云端实时：保存后全组立即可见 */
      if(window.DB && DB.mode === "cloud"){
        var saveBtn = document.querySelector("#achvModal .btn-primary");
        var restoreBtn = function(){ if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = "保存"; } };
        try{
          if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "保存中…"; }
          DB.upsert("achievements", obj).then(function(){
            location.reload();
          }).catch(function(e){
            restoreBtn();
            alert("云端保存失败：" + e.message + "\n已暂存本机，恢复网络后重新点一次保存即可同步全组。");
            saveLocalAchv(obj);
          });
          return;
        }catch(err){ restoreBtn(); alert("保存出错：" + (err && err.message || err)); }
      }
      saveLocalAchv(obj);
    }
    function saveLocalAchv(obj){
      var arr = getLocalItems();
      var i = arr.findIndex(x=>x.id===obj.id);
      if(i>=0) arr[i] = obj; else arr.push(obj);
      saveLocalItems(arr);
      location.reload();
    }
    window.submitAchv = submitAchv;

    function deleteAchv(id){
      var tip = (window.DB && DB.mode === "cloud")
        ? "确定删除这条成果吗？删除后全组都不再显示。"
        : "确定删除这条成果吗？当前是本机草稿模式，删除后仅本浏览器隐藏；恢复云端后可重新同步。";
      if(!confirm(tip)) return;
      /* 云端实时：删除后全组都不再显示 */
      if(window.DB && DB.mode === "cloud"){
        DB.remove("achievements", id).then(function(){ location.reload(); })
          .catch(function(e){
            alert("云端删除失败：" + e.message + "\n已先在本机隐藏，恢复网络后可重新删除。");
            saveLocalItems(getLocalItems().filter(x=>x.id!==id));
            location.reload();
          });
        return;
      }
      var official = (window.__officialAchv||[]).some(x=>x.id===id);
      // 本机新增的：直接从本机列表移除；官方条目：记入隐藏名单
      saveLocalItems(getLocalItems().filter(x=>x.id!==id));
      if(official){
        var del = getLocalDeleted();
        if(del.indexOf(id)<0){ del.push(id); saveLocalDeleted(del); }
      }
      location.reload();
    }
    window.deleteAchv = deleteAchv;

    // 导出（备用：自动同步失败时供排查）
    function exportAchvLocal(){
      var items = getLocalItems(), del = getLocalDeleted();
      if(!items.length && !del.length){ alert("当前浏览器没有待合并的修改。"); return; }
      document.getElementById("aexBox").value =
        "window.DATA = window.DATA || {};\n" +
        "window.DATA.achievementOverrides = " + JSON.stringify(items, null, 2) + ";\n" +
        "window.DATA.achievementDeletions = " + JSON.stringify(del, null, 2) + ";\n";
      document.getElementById("achvExportWrap").classList.add("open");
      document.getElementById("aexBox").select();
    }
    window.exportAchvLocal = exportAchvLocal;

    function closeAchvExport(){ document.getElementById("achvExportWrap").classList.remove("open"); }
    window.closeAchvExport = closeAchvExport;

    var achvExportWrap = document.createElement("div");
    achvExportWrap.id = "achvExportWrap";
    achvExportWrap.className = "modal";
    achvExportWrap.innerHTML = `<div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本机成果修改（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeAchvExport()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">（备用功能）网站已接入云端：恢复网络后刷新本页，本机修改会<b>自动上传合并到云端</b>，无需发给任何人。仅当自动同步始终失败时，才把下方内容交给网站维护者排查。</p>
        <textarea id="aexBox" rows="14" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>`;
    document.body.appendChild(achvExportWrap);
    document.getElementById("type").innerHTML = `<option value="">全部类型</option>` + types.map(t=>`<option>${esc(t)}</option>`).join("");
    var years = [...new Set((window.DATA.achievements||[]).map(a=>a.year).filter(Boolean))].sort((a,b)=>b-a);
    document.getElementById("year").innerHTML = `<option value="">全部年份</option>` + years.map(y=>`<option>${y}</option>`).join("");

    // ---------- 成果统计栏 ----------
    function renderStats(){
      var all = window.DATA.achievements || [];
      var papers = all.filter(a=>a.type==="期刊/会议论文");
      var theses = all.filter(a=>a.type==="学位论文");
      var awards = all.filter(a=>a.type==="获奖");
      var patents = all.filter(a=>a.type==="专利");
      var books  = all.filter(a=>a.type==="专著"||a.type==="软著");

      // 语言判定：优先用数据里手工指定的 lang 字段（"SCI"/"英文" 或 "中文"，不限大小写）；
      // 未指定时按常见"作者_期刊名_年份"格式取期刊名，含中文 → 中文，否则 → SCI（英文期刊）
      function lang(a){
        var v = (a.lang||"").trim().toLowerCase();
        if(v==="sci"||v==="en"||v==="英文") return "sci";
        if(v==="zh"||v==="cn"||v==="中文") return "zh";
        var seg = (a.title||"").split("_");
        var jname = seg.length >= 2 ? seg[1] : (a.journal || a.title || "");
        return /[\u4e00-\u9fff]/.test(jname) ? "zh" : "sci";
      }
      var sci = papers.filter(a=>lang(a)==="sci").length;
      var zh  = papers.filter(a=>lang(a)==="zh").length;
      var bo   = theses.filter(a=>(a.title||"").indexOf("博士")>=0).length;
      var shuo = theses.length - bo;
      var ys = all.map(a=>a.year).filter(Boolean).map(Number);
      var span = ys.length ? Math.min.apply(null,ys) + "–" + Math.max.apply(null,ys) : "—";

      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="num">' + papers.length + '</div><div class="lab">发表论文（期刊/会议）</div></div>' +
        '<div class="stat"><div class="num">' + sci + '</div><div class="lab">SCI 论文（英文期刊）</div></div>' +
        '<div class="stat"><div class="num">' + zh + '</div><div class="lab">中文论文</div></div>' +
        '<div class="stat"><div class="num">' + theses.length + '</div><div class="lab">学位论文 · 硕士' + shuo + ' 博士' + bo + '</div></div>' +
        '<div class="stat"><div class="num">' + awards.length + '</div><div class="lab">学生获奖（项）</div></div>' +
        '<div class="stat"><div class="num">' + patents.length + '</div><div class="lab">专利（项）</div></div>' +
        '<div class="stat"><div class="num">' + books.length + '</div><div class="lab">专著/软著（部）</div></div>' +
        '<div class="stat"><div class="num" style="font-size:22px; padding-top:4px;">' + span + '</div><div class="lab">统计年份跨度</div></div>';

      document.getElementById("statNote").textContent =
        "统计口径：以上数字由页面自动汇总当前已录入的成果，录入新成果后自动更新；SCI/中文按期刊名称自动判断，个别期刊如判断有误，可在该成果数据中加 lang:\"SCI\" 或 lang:\"中文\" 手工指定；专利按类型「专利」计数，专著与软著合并计数；部分记录未填年份，不影响总数统计。";
    }
    renderStats();


    var typeColor = {"期刊/会议论文":"blue","学位论文":"purple","获奖":"orange","专利":"green","软著":"blue","专著":"blue","基金":"gray"};
    function render(){
      var t = document.getElementById("type").value;
      var y = document.getElementById("year").value;
      var list = (window.DATA.achievements||[]).filter(a=>{
        var ok1 = !t || a.type===t;
        var ok2 = !y || String(a.year)===y;
        return ok1 && ok2;
      });
      document.getElementById("rows").innerHTML = list.length ? list.map(a=>`
        <tr>
          <td>${badge(a.type, typeColor[a.type]||"purple")}</td>
          <td>${esc(a.title)}</td>
          <td>${esc((a.authors||[]).join("、"))}</td>
          <td>${esc(a.journal)||"—"}</td>
          <td>${a.year||"—"}</td>
          <td>${esc(a.zone)||"—"}</td>
          <td>${esc(a.project)}</td>
          <td>
            ${a.type==="获奖" ? `<span style="color:var(--muted);font-size:12px;">${esc(a.note||"若需要证书等证明文件，请联系获奖本人或网页管理员。")}</span>` : (a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">查看/下载</a>`:"—")}
          </td>
          <td style="white-space:nowrap;">
            <button class="btn btn-xs btn-outline" onclick="openAchvModal('${esc(a.id)}')">编辑</button>
            <button class="btn btn-xs btn-danger" onclick="deleteAchv('${esc(a.id)}')">删除</button>
          </td>
        </tr>`).join("") : `<tr><td colspan="9">${emptyTip("没有匹配的成果")}</td></tr>`;
    }
    document.getElementById("type").addEventListener("change", render);
    document.getElementById("year").addEventListener("change", render);
    render();

    // ---------- 云端实时模式：连接后拉取全组数据并重渲染 ----------
    var __cloudReady = (window.DB ? DB.ready() : Promise.resolve("local"));
    __cloudReady.then(function(mode){
      var el = document.getElementById("dbBanner");
      if(el && window.DB) el.innerHTML = DB.statusBanner();
      var hint = document.getElementById("acHint");
      if(mode !== "cloud"){
        if(hint) hint.innerHTML = '⚠ 本机草稿模式（云端未连接）：修改只在本浏览器可见。可能是网络波动，刷新页面可重试；恢复云端后本机修改会自动同步全组。';
        if(hint) hint.style.color = "#b45309";
        return;
      }
      if(hint) hint.innerHTML = '🟢 云端实时模式：添加/编辑/删除保存后<b>全组立即可见</b>（手机/其他电脑打开都一样）。';
      return DB.hydrate("achievements", "achievements").then(function(){
        // 年份下拉按云端数据补充新年份
        var years2 = [...new Set((window.DATA.achievements||[]).map(a=>a.year).filter(Boolean))].sort((a,b)=>b-a);
        var cur = document.getElementById("year").value;
        document.getElementById("year").innerHTML = `<option value="">全部年份</option>` + years2.map(y=>`<option>${esc(y)}</option>`).join("");
        document.getElementById("year").value = cur;
        renderStats();
        render();
      });
    }).catch(function(){});
  </script>
<script src="../assets/js/gate.js?v=3.9"></script>
</body>
</html>
