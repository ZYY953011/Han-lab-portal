<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成员 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.8">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div id="dbBanner"></div>
    <!-- 成员统计栏：数字由下方脚本按数据自动汇总，改数据即自动更新 -->
    <div class="stat-row" id="stats" style="margin-top:4px;"></div>
    <p id="statNote" style="font-size:12.5px; color:var(--muted); margin:8px 0 0;"></p>
    <div class="toolbar">
      <select id="role">
        <option value="">全部身份</option>
        <option value="博士后">博士后</option>
        <option value="博士生">博士生</option>
        <option value="硕士生">硕士生</option>
        <option value="已毕业成员">已毕业成员</option>
      </select>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-primary btn-sm" onclick="openMemberModal()">＋ 添加成员</button>
        <button class="btn btn-outline btn-sm local-only-btn" onclick="exportMemberLocal()">导出我添加的修改（JSON）</button>
      </div>
    </div>
    <p id="mbHint" style="font-size:12.5px; color:var(--muted); margin:6px 0 0;">提示：添加/编辑/删除保存后全组实时可见（数据保存在云端）。录入手机号、邮箱前请先征得本人同意。</p>
    <div class="grid grid-3" id="list" style="margin-top:10px;"></div>
  </main>

  <script src="../assets/js/data/members.js?v=3.8"></script>
  <script src="../assets/js/data/member-overrides.js?v=3.8"></script>
  <script src="../assets/js/config.js?v=3.8"></script>
  <script src="../assets/js/app.js?v=3.8"></script>
  <script src="../assets/js/backend.js?v=3.8"></script>
  <script>
    injectHeader("成员");
    document.getElementById("head").insertAdjacentHTML("afterend",
      unpublishedBar((getMemberItems() || []).length + (getMemberDeleted() || []).length, "exportMemberLocal()"));
    document.getElementById("head").innerHTML = pageHead(
      "成员信息", "组内成员概况、擅长技能、可互助内容与联系方式（联系方式等敏感信息未来需权限控制）。",
      [{name:"首页", url:"../index.html"}, {name:"成员"}]
    );

    // ---------- 本机临时修改（云端未连接时的兜底，恢复后自动同步） ----------
    function getMemberItems(){ try{ return JSON.parse(localStorage.getItem("member-items")||"[]"); }catch(e){ return []; } }
    function saveMemberItems(arr){ localStorage.setItem("member-items", JSON.stringify(arr)); }
    function getMemberDeleted(){ try{ return JSON.parse(localStorage.getItem("member-deleted")||"[]"); }catch(e){ return []; } }
    function saveMemberDeleted(arr){ localStorage.setItem("member-deleted", JSON.stringify(arr)); }

    // 留存"全站原始数据"副本，用于区分"本机新增"与"修改官方条目"
    window.__officialMembers = (window.DATA.members||[]).slice();

    // 应用本机修改（须在统计与渲染前执行）
    (function applyMemberLocal(){
      var list = window.DATA.members = window.DATA.members || [];
      getMemberItems().forEach(function(p){
        if(!p || !p.id) return;
        var i = list.findIndex(x=>x.id===p.id);
        if(i>=0) list[i] = Object.assign({}, list[i], p); else list.push(p);
      });
      var del = getMemberDeleted();
      if(del.length) window.DATA.members = list.filter(m=>del.indexOf(m.id)<0);
    })();

    function nextMemberId(){
      var max = 0;
      (window.DATA.members||[]).forEach(function(x){
        var m = /^([A-Za-z]+)(\d+)$/.exec(x.id||"");
        if(m && m[1]==="M") max = Math.max(max, parseInt(m[2],10));
      });
      return "M" + String(max+1).padStart(3,"0");
    }

    // ---------- 成员统计栏 ----------
    function renderStats(){
      var all = window.DATA.members || [];
      // 口径：博士后单列；其余按在校状态分——"在籍"=在读，"不在籍"=已毕业
      var cur  = all.filter(m=>m.role!=="博士后" && m.status && m.status.indexOf("不在籍")<0);
      var grad = all.filter(m=>m.role!=="博士后" && m.status && m.status.indexOf("不在籍")>=0);
      var post = all.filter(m=>m.role==="博士后");
      function cnt(arr, role){ return arr.filter(m=>m.role===role).length; }
      function breakdown(arr){
        // 依次统计 硕士/博士/本科（有人才显示），如"硕士18 博士7"
        return ["硕士生","博士生","本科生"]
          .filter(r=>cnt(arr,r)>0)
          .map(r=>r.slice(0,2) + cnt(arr,r))
          .join(" · ") || "—";
      }
      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="num">' + all.length + '</div><div class="lab">成员总数</div></div>' +
        '<div class="stat"><div class="num">' + cur.length + '</div><div class="lab">在读学生 · ' + breakdown(cur) + '</div></div>' +
        '<div class="stat"><div class="num">' + grad.length + '</div><div class="lab">已毕业人次 · ' + breakdown(grad) + '</div></div>' +
        '<div class="stat"><div class="num">' + post.length + '</div><div class="lab">博士后</div></div>';
      document.getElementById("statNote").textContent =
        "统计口径：按成员数据里的「在校状态」自动汇总——在籍 = 在读，不在籍 = 已毕业；博士后单列不计入学生。新增或修改成员后数字自动更新。";
    }
    renderStats();


    function card(m){
      var all = (window.DATA.achievements||[]).filter(a=>a.relatedMember===m.id);
      var papers = all.filter(a=>a.type!=="获奖" && a.url);
      var awards = all.filter(a=>a.type==="获奖");
      var paperHtml = papers.length ? `<dt>文章成果</dt><dd>${papers.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`).join("<br>")}</dd>` : "";
      var awardHtml = awards.length ? `<dt>获奖情况</dt><dd>${awards.map(a=>`${esc(a.title)}`).join("<br>")}</dd>` : "";
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h3 style="font-size:17px; color:var(--primary-dark);">${esc(m.name)}</h3>
          <div style="display:flex; gap:4px; flex-shrink:0; align-items:flex-start; flex-wrap:wrap; justify-content:flex-end;">
            ${badge(m.role)}
            <button class="btn btn-xs btn-outline" onclick="openMemberModal('${esc(m.id)}')">编辑</button>
            <button class="btn btn-xs btn-danger" onclick="deleteMember('${esc(m.id)}')">删除</button>
          </div>
        </div>
        <dl class="kv" style="margin-top:8px;">
          ${(m.grade||m.category)?`<dt>年级/类别</dt><dd>${esc(m.grade)}${m.grade&&m.category?" · ":""}${esc(m.category)}</dd>`:""}
          ${m.studentNo?`<dt>学号</dt><dd>${esc(m.studentNo)}</dd>`:""}
          ${m.research?`<dt>研究方向</dt><dd>${esc(m.research)}</dd>`:""}
          ${m.fieldSite?`<dt>试验地</dt><dd>${esc(m.fieldSite)}</dd>`:""}
          ${m.seat?`<dt>工位</dt><dd>${esc(m.seat)}</dd>`:""}
          ${m.status?`<dt>在校状态</dt><dd>${esc(m.status)}</dd>`:""}
          ${m.contact?`<dt>邮箱</dt><dd>${esc(m.contact)}</dd>`:""}
          ${m.phone?`<dt>手机</dt><dd>${esc(m.phone)}</dd>`:""}
          ${m.wechat?`<dt>微信</dt><dd>${esc(m.wechat)}</dd>`:""}
          ${paperHtml}
          ${awardHtml}
          <dt>更多</dt><dd><a href="achievements.html">在成果页查看全部</a></dd>
        </dl>
      </div>`;
    }
    function render(){
      var r = document.getElementById("role").value;
      var list = (window.DATA.members||[]).filter(m=>{
        if(!r || r==="全部身份") return true;
        if(r==="已毕业成员") return m.role!=="博士后" && m.status && m.status.indexOf("不在籍")>=0;
        return m.role===r;
      });
      document.getElementById("list").innerHTML = list.length ? list.map(card).join("") : emptyTip("没有匹配的成员");
    }
    document.getElementById("role").addEventListener("change", render);
    render();

    // ---------- 云端实时模式：连接后拉取全组数据并重渲染 ----------
    var __cloudReady = (window.DB ? DB.ready() : Promise.resolve("local"));
    __cloudReady.then(function(mode){
      var el = document.getElementById("dbBanner");
      if(el && window.DB) el.innerHTML = DB.statusBanner();
      var hint = document.getElementById("mbHint");
      if(mode !== "cloud"){
        if(hint) hint.innerHTML = '⚠ 本机草稿模式（云端未连接）：修改只在本浏览器可见。可能是网络波动，刷新页面可重试；恢复云端后本机修改会自动同步全组。';
        if(hint) hint.style.color = "#b45309";
        return;
      }
      if(hint) hint.innerHTML = '🟢 云端实时模式：添加/编辑/删除保存后<b>全组立即可见</b>（手机/其他电脑打开都一样）。';
      return DB.hydrate("members", "members").then(function(){
        renderStats();
        render();
      });
    }).catch(function(){});

    // ---------- 添加 / 编辑成员弹窗 ----------
    var memberModal = document.createElement("div");
    memberModal.id = "memberModal";
    memberModal.className = "modal";
    memberModal.innerHTML = `<div class="modal-box" style="max-width:640px;">
      <div class="modal-head"><b id="mmTitle">添加成员</b><button class="btn btn-sm btn-outline" onclick="closeMemberModal()">关闭</button></div>
      <div class="modal-body">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div><label>姓名 <span style="color:red">*</span></label><input type="text" id="mmName" placeholder="姓名"></div>
          <div><label>身份 <span style="color:red">*</span></label>
            <select id="mmRole" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option>硕士生</option><option>博士生</option><option>博士后</option><option>本科生</option><option>教师</option>
            </select></div>
          <div><label>年级</label><input type="text" id="mmGrade" placeholder="如 2026级"></div>
          <div><label>类别</label><input type="text" id="mmCategory" placeholder="如 硕士 / 全日制专业学位硕士"></div>
          <div><label>学号</label><input type="text" id="mmStudentNo"></div>
          <div><label>在校状态</label>
            <select id="mmStatus" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option>在籍在校</option><option>不在籍在校</option><option>不在籍不在校</option>
            </select></div>
          <div style="grid-column:1/-1;"><label>研究方向</label><input type="text" id="mmResearch" placeholder="选填"></div>
          <div><label>试验地</label><input type="text" id="mmFieldSite" placeholder="选填，如 杨凌素丰+生物炭+小麦"></div>
          <div><label>工位</label><input type="text" id="mmSeat" placeholder="选填，如 农科楼807"></div>
          <div><label>邮箱</label><input type="text" id="mmContact" placeholder="选填（公开可见，请本人同意）"></div>
          <div><label>手机</label><input type="text" id="mmPhone" placeholder="选填（公开可见，请本人同意）"></div>
          <div><label>微信</label><input type="text" id="mmWechat" placeholder="选填（公开可见，请本人同意）"></div>
        </div>
        <div style="margin-top:14px;">
          <button class="btn btn-primary" onclick="submitMember()">保存</button>
          <button class="btn btn-outline" onclick="closeMemberModal()" style="margin-left:8px;">取消</button>
        </div>
        <p id="mmHint" style="font-size:12px; color:var(--muted); margin-top:10px;">保存后全组实时可见（云端）；若提示未连接云端，则暂存本机，恢复后刷新页面再保存一次即可同步全组。</p>
      </div>
    </div>`;
    document.body.appendChild(memberModal);

    function openMemberModal(id){
      document.getElementById("mmTitle").textContent = id ? "编辑成员" : "添加成员";
      var m = id ? (window.DATA.members||[]).find(x=>x.id===id) : null;
      document.getElementById("mmName").value = m ? (m.name||"") : "";
      document.getElementById("mmRole").value = m ? (m.role||"硕士生") : "硕士生";
      document.getElementById("mmGrade").value = m ? (m.grade||"") : "";
      document.getElementById("mmCategory").value = m ? (m.category||"") : "";
      document.getElementById("mmStudentNo").value = m ? (m.studentNo||"") : "";
      document.getElementById("mmStatus").value = m ? (m.status||"在籍在校") : "在籍在校";
      document.getElementById("mmResearch").value = m ? (m.research||"") : "";
      document.getElementById("mmFieldSite").value = m ? (m.fieldSite||"") : "";
      document.getElementById("mmSeat").value = m ? (m.seat||"") : "";
      document.getElementById("mmContact").value = m ? (m.contact||"") : "";
      document.getElementById("mmPhone").value = m ? (m.phone||"") : "";
      document.getElementById("mmWechat").value = m ? (m.wechat||"") : "";
      document.getElementById("memberModal").dataset.id = id || "";
      document.getElementById("memberModal").classList.add("open");
    }
    window.openMemberModal = openMemberModal;

    function closeMemberModal(){
      document.getElementById("memberModal").classList.remove("open");
    }
    window.closeMemberModal = closeMemberModal;

    function submitMember(){
      var id = document.getElementById("memberModal").dataset.id;
      var name = document.getElementById("mmName").value.trim();
      if(!name){ alert("请填写姓名"); return; }
      var saveBtn = document.querySelector("#memberModal .btn-primary");
      var restoreBtn = function(){ if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = "保存"; } };
      var obj = {
        id: id || nextMemberId(),
        name: name,
        role: document.getElementById("mmRole").value,
        grade: document.getElementById("mmGrade").value.trim(),
        category: document.getElementById("mmCategory").value.trim(),
        studentNo: document.getElementById("mmStudentNo").value.trim(),
        status: document.getElementById("mmStatus").value,
        research: document.getElementById("mmResearch").value.trim(),
        fieldSite: document.getElementById("mmFieldSite").value.trim(),
        seat: document.getElementById("mmSeat").value.trim(),
        contact: document.getElementById("mmContact").value.trim(),
        phone: document.getElementById("mmPhone").value.trim(),
        wechat: document.getElementById("mmWechat").value.trim()
      };
      /* 云端实时：保存后全组立即可见 */
      if(window.DB && DB.mode === "cloud"){
        try{
          if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "保存中…"; }
          DB.upsert("members", obj).then(function(){
            location.reload();
          }).catch(function(e){
            restoreBtn();
            alert("云端保存失败：" + e.message + "\n已暂存本机，恢复网络后重新点一次保存即可同步全组。");
            saveMemberLocal(obj);
          });
          return;
        }catch(err){ restoreBtn(); alert("保存出错：" + (err && err.message || err)); }
      }
      saveMemberLocal(obj);
    }
    function saveMemberLocal(obj){
      var arr = getMemberItems();
      var i = arr.findIndex(x=>x.id===obj.id);
      if(i>=0) arr[i] = obj; else arr.push(obj);
      saveMemberItems(arr);
      location.reload();
    }
    window.submitMember = submitMember;

    function deleteMember(id){
      var tip = (window.DB && DB.mode === "cloud")
        ? "确定删除这位成员吗？删除后全组都不再显示。"
        : "确定删除这位成员吗？当前是本机草稿模式，删除后仅本浏览器隐藏；恢复云端后可重新同步。";
      if(!confirm(tip)) return;
      /* 云端实时：删除后全组都不再显示 */
      if(window.DB && DB.mode === "cloud"){
        DB.remove("members", id).then(function(){ location.reload(); })
          .catch(function(e){
            alert("云端删除失败：" + e.message + "\n已先在本机隐藏，恢复网络后可重新删除。");
            saveMemberItems(getMemberItems().filter(x=>x.id!==id));
            location.reload();
          });
        return;
      }
      var official = (window.__officialMembers||[]).some(x=>x.id===id);
      saveMemberItems(getMemberItems().filter(x=>x.id!==id));
      if(official){
        var del = getMemberDeleted();
        if(del.indexOf(id)<0){ del.push(id); saveMemberDeleted(del); }
      }
      location.reload();
    }
    window.deleteMember = deleteMember;

    // 导出（备用：自动同步失败时供排查）
    function exportMemberLocal(){
      var items = getMemberItems(), del = getMemberDeleted();
      if(!items.length && !del.length){ alert("当前浏览器没有待合并的修改。"); return; }
      document.getElementById("mexBox").value =
        "window.DATA = window.DATA || {};\n" +
        "window.DATA.memberOverrides = " + JSON.stringify(items, null, 2) + ";\n" +
        "window.DATA.memberDeletions = " + JSON.stringify(del, null, 2) + ";\n";
      document.getElementById("memberExportWrap").classList.add("open");
      document.getElementById("mexBox").select();
    }
    window.exportMemberLocal = exportMemberLocal;

    function closeMemberExport(){ document.getElementById("memberExportWrap").classList.remove("open"); }
    window.closeMemberExport = closeMemberExport;

    var memberExportWrap = document.createElement("div");
    memberExportWrap.id = "memberExportWrap";
    memberExportWrap.className = "modal";
    memberExportWrap.innerHTML = `<div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本机成员修改（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeMemberExport()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">（备用功能）网站已接入云端：恢复网络后刷新本页，本机修改会<b>自动上传合并到云端</b>，无需发给任何人。仅当自动同步始终失败时，才把下方内容交给网站维护者排查。</p>
        <textarea id="mexBox" rows="14" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>`;
    document.body.appendChild(memberExportWrap);
  </script>
<script src="../assets/js/gate.js?v=3.8"></script>
</body>
</html>
