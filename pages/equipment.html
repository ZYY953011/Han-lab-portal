<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪器耗材 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.9">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <!-- 统计栏：按当前（合并后）台账自动汇总 -->
    <div class="stat-row" id="stats" style="margin-top:4px;"></div>
    <p id="statNote" style="font-size:12.5px; color:var(--muted); margin:8px 0 0;"></p>

    <div class="toolbar">
      <input class="grow" id="kw" placeholder="搜索名称 / 型号规格 / 品牌 / 位置 / 登记人 / 备注…" style="min-width:200px;">
      <select id="locFilter"><option value="">全部位置</option></select>
      <select id="statusFilter"><option value="">全部状态</option></select>
      <select id="sortBy">
        <option value="location">按存放位置</option>
        <option value="name">按名称</option>
        <option value="latest">最新添加在前</option>
        <option value="qty">数量从多到少</option>
      </select>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-primary btn-sm" onclick="openEqModal()">＋ 添加条目</button>
        <button class="btn btn-outline btn-sm local-only-btn" onclick="exportEqLocal()">导出我添加的修改（JSON）</button>
      </div>
    </div>
    <p id="eqFormHint" style="font-size:12.5px; color:var(--muted); margin:6px 0 0;">提示：添加/编辑/删除保存后全组实时可见（数据保存在云端）。</p>

    <!-- 仪器设备 -->
    <div class="section-title" style="margin-top:18px;">仪器设备 <span id="instCount" style="font-size:14px; color:var(--muted); font-weight:400;"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="min-width:150px;">名称</th><th>型号 / 规格</th><th>品牌 / 厂家</th>
          <th style="width:78px;">数量</th><th style="min-width:130px;">存放位置</th><th style="width:100px;">购置 / 登记人</th>
          <th style="width:90px;">购置日期</th><th style="width:90px;">状态</th><th style="width:110px;">说明书 / 材料</th>
          <th style="min-width:140px;">备注</th><th style="width:110px;">操作</th>
        </tr></thead>
        <tbody id="instRows"></tbody>
      </table>
    </div>

    <!-- 耗材 -->
    <div class="section-title" style="margin-top:22px;">耗材 <span id="consCount" style="font-size:14px; color:var(--muted); font-weight:400;"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="min-width:150px;">名称</th><th>规格</th><th>品牌 / 厂家</th>
          <th style="width:100px;">剩余数量</th><th style="min-width:130px;">存放位置</th><th style="width:100px;">购置 / 登记人</th>
          <th style="width:90px;">购置日期</th><th style="width:90px;">状态</th><th style="width:110px;">说明书 / 材料</th>
          <th style="min-width:140px;">备注</th><th style="width:110px;">操作</th>
        </tr></thead>
        <tbody id="consRows"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/js/data/equipment.js?v=3.9"></script>
  <script src="../assets/js/data/equipment-overrides.js?v=3.9"></script>
  <script src="../assets/js/config.js?v=3.9"></script>
  <script src="../assets/js/app.js?v=3.9"></script>
  <script src="../assets/js/backend.js?v=3.9"></script>
  <script>
    injectHeader("仪器耗材");
    document.getElementById("head").insertAdjacentHTML("afterend",
      unpublishedBar((getEqItems() || []).length + (getEqDeleted() || []).length, "exportEqLocal()"));
    document.getElementById("head").insertAdjacentHTML("afterend", '<div id="dbBanner"></div>');

    /* 云端模式：取回全组共享台账 */
    (window.DB ? DB.ready() : Promise.resolve("local")).then(function(mode){
      var el = document.getElementById("dbBanner");
      if(el && window.DB) el.innerHTML = DB.statusBanner();
      var hint = document.getElementById("eqFormHint");
      if(mode !== "cloud"){
        if(hint) hint.innerHTML = '⚠ 当前是本机草稿模式（云端未连接）：保存只在本浏览器可见。可能是网络波动，刷新页面可重试。';
        return;
      }
      if(hint) hint.innerHTML = '🟢 云端实时模式：添加/编辑/删除保存后<b>全组立即可见</b>，无需导出或发布。';
      return DB.hydrate("equipment","equipment").then(function(){
        try { if(typeof window.__officialEq !== "undefined") window.__officialEq = (window.DATA.equipment||[]).slice(); } catch(e){}
        try { renderStats(); initFilters(); if(typeof render === "function") render(); } catch(e){}
      });
    }).catch(function(){});
    document.getElementById("head").innerHTML = pageHead(
      "仪器设备及耗材", "组内仪器设备与耗材台账：有什么、有多少、放在哪里、谁登记的、说明书在哪。支持搜索、按位置归类与手工增删，轻松维护。",
      [{name:"首页", url:"../index.html"}, {name:"仪器耗材"}]
    );

    /* ---------- 本机临时修改（云端未连接时的兜底，恢复后自动同步） ---------- */
    function getEqItems(){ try{ return JSON.parse(localStorage.getItem("equip-items")||"[]"); }catch(e){ return []; } }
    function saveEqItems(arr){ localStorage.setItem("equip-items", JSON.stringify(arr)); }
    function getEqDeleted(){ try{ return JSON.parse(localStorage.getItem("equip-deleted")||"[]"); }catch(e){ return []; } }
    function saveEqDeleted(arr){ localStorage.setItem("equip-deleted", JSON.stringify(arr)); }

    // 留存"全站原始数据"副本，用于区分"本机新增"与"修改官方条目"
    window.__officialEq = (window.DATA.equipment||[]).slice();

    (function applyEqLocal(){
      var list = window.DATA.equipment = window.DATA.equipment || [];
      getEqItems().forEach(function(p){
        if(!p || !p.id) return;
        var i = list.findIndex(x=>x.id===p.id);
        if(i>=0) list[i] = Object.assign({}, list[i], p); else list.push(p);
      });
      var del = getEqDeleted();
      if(del.length) window.DATA.equipment = list.filter(e=>del.indexOf(e.id)<0);
    })();

    function nextEqId(){
      var max = 0;
      (window.DATA.equipment||[]).forEach(function(x){
        var m = /^([A-Za-z]+)(\d+)$/.exec(x.id||"");
        if(m) max = Math.max(max, parseInt(m[2],10));
      });
      return "E" + String(max+1).padStart(3,"0");
    }

    /* ---------- 统计栏 ---------- */
    function renderStats(){
      var all = window.DATA.equipment || [];
      var inst = all.filter(e=>e.category!=="耗材");
      var cons = all.filter(e=>e.category==="耗材");
      var locs  = [...new Set(all.map(e=>e.location).filter(Boolean))];
      var alert = all.filter(e=>["需采购","偏少","维修中","已报废"].indexOf(e.status)>=0);
      function instQty(){
        return inst.reduce(function(s,e){ return s + (parseFloat(e.qty)||0); },0);
      }
      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="num">' + inst.length + '</div><div class="lab">仪器设备（' + instQty() + ' 台/件）</div></div>' +
        '<div class="stat"><div class="num">' + cons.length + '</div><div class="lab">耗材种类</div></div>' +
        '<div class="stat"><div class="num">' + locs.length + '</div><div class="lab">存放位置（处）</div></div>' +
        '<div class="stat"><div class="num">' + alert.length + '</div><div class="lab">需关注（需采购/偏少/维修/报废）</div></div>';
      document.getElementById("statNote").textContent =
        "统计口径：按当前台账实时汇总——仪器设备按数量合计，耗材按种类计；状态为需采购、偏少、维修中、已报废的条目计入「需关注」。";
    }
    renderStats();

    /* ---------- 筛选器初始化 ---------- */
    function initFilters(){
      var all = window.DATA.equipment || [];
      var locSel = document.getElementById("locFilter");
      var curLoc = locSel.value;
      locSel.innerHTML = '<option value="">全部位置</option>';
      [...new Set(all.map(e=>e.location).filter(Boolean))].sort().forEach(function(l){
        var o = document.createElement("option"); o.value = l; o.textContent = l; locSel.appendChild(o);
      });
      locSel.value = curLoc;
      var stSel = document.getElementById("statusFilter");
      var curSt = stSel.value;
      stSel.innerHTML = '<option value="">全部状态</option>';
      [...new Set(all.map(e=>e.status).filter(Boolean))].sort().forEach(function(s){
        var o = document.createElement("option"); o.value = s; o.textContent = s; stSel.appendChild(o);
      });
      stSel.value = curSt;
    }
    initFilters();

    /* ---------- 列表渲染 ---------- */
    function filtered(){
      var kw = document.getElementById("kw").value.trim().toLowerCase();
      var loc = document.getElementById("locFilter").value;
      var st  = document.getElementById("statusFilter").value;
      var sort = document.getElementById("sortBy").value;
      var list = (window.DATA.equipment||[]).filter(function(e){
        var s = ((e.name||"")+(e.model||"")+(e.brand||"")+(e.location||"")+(e.keeper||"")+(e.note||"")).toLowerCase();
        return (!kw || s.indexOf(kw)>=0) && (!loc || e.location===loc) && (!st || e.status===st);
      });
      if(sort==="name")   list.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      else if(sort==="latest") list.reverse();
      else if(sort==="qty")    list.sort((a,b)=>(parseFloat(b.qty)||0)-(parseFloat(a.qty)||0));
      else list.sort((a,b)=>(a.location||"").localeCompare(b.location||"") || (a.name||"").localeCompare(b.name||""));
      return list;
    }

    function parsePhotos(v){
      try {
        var arr = typeof v === "string" ? JSON.parse(v) : (Array.isArray(v) ? v : []);
        return Array.isArray(arr) ? arr.filter(function(u){ return typeof u === "string" && u.indexOf("http") === 0; }) : [];
      } catch(err){ return []; }
    }
    window.parsePhotos = parsePhotos;

    function row(e){
      var stColor = {"在用":"green","充足":"green","闲置":"gray","偏少":"orange","借用中":"blue",
                     "维修中":"orange","需采购":"red","已报废":"gray"}[e.status] || "gray";
      var photos = parsePhotos(e.photos);
      var thumb = photos.length
        ? '<img src="' + esc(photos[0]) + '" alt="照片" loading="lazy" ' +
          'style="width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:zoom-in; margin-right:8px; vertical-align:middle; flex-shrink:0;" ' +
          'onclick="showEqPhotoViewer(\'' + esc(e.id) + '\')" ' +
          'onerror="this.style.display=\'none\'">'
        : '';
      return '<tr>' +
        '<td><div style="display:flex; align-items:center;">' + thumb + '<b>' + esc(e.name) + '</b></div></td>' +
        '<td>' + esc(e.model||"—") + '</td>' +
        '<td>' + esc(e.brand||"—") + '</td>' +
        '<td>' + esc(e.qty||"—") + ' ' + esc(e.unit||"") + '</td>' +
        '<td>' + esc(e.location||"—") + '</td>' +
        '<td>' + esc(e.keeper||"—") + '</td>' +
        '<td>' + esc(e.purchaseDate||"—") + '</td>' +
        '<td>' + (e.status ? badge(e.status, stColor) : "—") + '</td>' +
        '<td>' + (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">查看/下载 ↗</a>' : '<span style="color:var(--muted);">—</span>') + '</td>' +
        '<td style="color:#44505f;">' + esc(e.note||"") + '</td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="btn btn-xs btn-outline" onclick="openEqModal(\'' + esc(e.id) + '\')">编辑</button> ' +
          '<button class="btn btn-xs btn-danger" onclick="deleteEq(\'' + esc(e.id) + '\')">删除</button>' +
        '</td>' +
      '</tr>';
    }

    function render(){
      var list = filtered();
      var inst = list.filter(e=>e.category!=="耗材");
      var cons = list.filter(e=>e.category==="耗材");
      document.getElementById("instCount").textContent = "（" + inst.length + " 条）";
      document.getElementById("consCount").textContent = "（" + cons.length + " 条）";
      document.getElementById("instRows").innerHTML = inst.length ? inst.map(row).join("")
        : '<tr><td colspan="11">' + emptyTip("暂无仪器设备记录，点右上角「＋ 添加条目」录入") + '</td></tr>';
      document.getElementById("consRows").innerHTML = cons.length ? cons.map(row).join("")
        : '<tr><td colspan="11">' + emptyTip("暂无耗材记录，点右上角「＋ 添加条目」录入") + '</td></tr>';
    }

    /* ---------- 添加 / 编辑弹窗 ---------- */
    var eqModal = document.createElement("div");
    eqModal.id = "eqModal";
    eqModal.className = "modal";
    eqModal.innerHTML = `<div class="modal-box" style="max-width:680px; display:flex; flex-direction:column; padding:0;">
      <div class="modal-head" style="flex-shrink:0;"><b id="eqTitle">添加条目</b><button class="btn btn-sm btn-outline" onclick="closeEqModal()">关闭</button></div>
      <div class="modal-body" style="overflow-y:auto; flex:1; min-height:0;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div><label>类别 <span style="color:red">*</span></label>
            <select id="eqCategory" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option>仪器设备</option><option>耗材</option>
            </select></div>
          <div><label>名称 <span style="color:red">*</span></label><input type="text" id="eqName" placeholder="如 土壤呼吸测定系统 / 离心管"></div>
          <div><label>型号 / 规格</label><input type="text" id="eqModel" placeholder="仪器填型号，耗材填规格，如 50 mL 尖底"></div>
          <div><label>品牌 / 厂家</label><input type="text" id="eqBrand" placeholder="选填"></div>
          <div><label>数量</label><input type="text" id="eqQty" placeholder="仪器一般填 1，耗材填余量"></div>
          <div><label>单位</label><input type="text" id="eqUnit" placeholder="台 / 套 / 支 / 盒 / 瓶 / 包 …"></div>
          <div><label>存放位置 <span style="color:red">*</span></label><input type="text" id="eqLocation" placeholder="如 农科楼 311 室 3 号柜"></div>
          <div><label>购置 / 登记人</label><input type="text" id="eqKeeper" placeholder="姓名"></div>
          <div><label>购置日期</label><input type="text" id="eqPurchaseDate" placeholder="如 2025-09"></div>
          <div><label>购置金额</label><input type="text" id="eqPrice" placeholder="选填，如 2.8 万元"></div>
          <div><label>状态</label>
            <select id="eqStatus" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
              <option>在用</option><option>闲置</option><option>借用中</option><option>维修中</option><option>已报废</option>
              <option>充足</option><option>偏少</option><option>需采购</option>
            </select></div>
          <div style="grid-column:1/-1;"><label>电子说明书 / 购置材料链接（飞书链接）</label><input type="text" id="eqUrl" placeholder="https://my.feishu.cn/…"></div>
          <div style="grid-column:1/-1;"><label>备注</label><input type="text" id="eqNote" placeholder="借用规则、安全须知、低于多少请补货等"></div>
          <div style="grid-column:1/-1;">
            <label>📷 照片（选填，最多 4 张；上传前自动压缩，一张约 100KB）</label>
            <div id="eqPhotoList" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;"></div>
            <input type="file" id="eqPhotoInput" accept="image/*" multiple style="display:none;">
            <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('eqPhotoInput').click()">📷 添加照片</button>
            <span id="eqPhotoHint" style="font-size:12px; color:var(--muted); margin-left:8px;"></span>
          </div>
        </div>
        <p style="font-size:12px; color:var(--muted); margin-top:10px;">保存后全组实时可见（云端）；若提示未连接云端，则暂存本机，恢复后刷新页面再保存一次即可同步全组。</p>
      </div>
      <div style="flex-shrink:0; padding:12px 18px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; background:#fff; border-radius:0 0 var(--radius) var(--radius);">
        <button class="btn btn-outline" onclick="closeEqModal()">取消</button>
        <button class="btn btn-primary" onclick="submitEq()">保存</button>
      </div>
    </div>`;
    document.body.appendChild(eqModal);

    function openEqModal(id){
      document.getElementById("eqTitle").textContent = id ? "编辑条目" : "添加条目";
      var e = id ? (window.DATA.equipment||[]).find(x=>x.id===id) : null;
      document.getElementById("eqCategory").value = e ? (e.category||"仪器设备") : "仪器设备";
      document.getElementById("eqName").value         = e ? (e.name||"") : "";
      document.getElementById("eqModel").value        = e ? (e.model||"") : "";
      document.getElementById("eqBrand").value        = e ? (e.brand||"") : "";
      document.getElementById("eqQty").value          = e ? (e.qty||"") : "";
      document.getElementById("eqUnit").value         = e ? (e.unit||"") : "";
      document.getElementById("eqLocation").value     = e ? (e.location||"") : "";
      document.getElementById("eqKeeper").value       = e ? (e.keeper||"") : "";
      document.getElementById("eqPurchaseDate").value = e ? (e.purchaseDate||"") : "";
      document.getElementById("eqPrice").value        = e ? (e.price||"") : "";
      document.getElementById("eqStatus").value       = e && e.status ? e.status : "在用";
      document.getElementById("eqUrl").value          = e ? (e.url||"") : "";
      document.getElementById("eqNote").value         = e ? (e.note||"") : "";
      eqPhotoState = e ? parsePhotos(e.photos) : [];
      renderPhotoList();
      document.getElementById("eqModal").dataset.id = id || "";
      document.getElementById("eqModal").classList.add("open");
    }
    window.openEqModal = openEqModal;

    function closeEqModal(){ document.getElementById("eqModal").classList.remove("open"); }
    window.closeEqModal = closeEqModal;

    function submitEq(){
      var id = document.getElementById("eqModal").dataset.id;
      var name = document.getElementById("eqName").value.trim();
      var loc  = document.getElementById("eqLocation").value.trim();
      if(!name){ alert("请填写名称"); return; }
      if(!loc){ alert("请填写存放位置，方便大家找到它"); return; }
      var obj = {
        id: id || nextEqId(),
        category: document.getElementById("eqCategory").value,
        name: name,
        model: document.getElementById("eqModel").value.trim(),
        brand: document.getElementById("eqBrand").value.trim(),
        qty: document.getElementById("eqQty").value.trim(),
        unit: document.getElementById("eqUnit").value.trim(),
        location: loc,
        keeper: document.getElementById("eqKeeper").value.trim(),
        purchaseDate: document.getElementById("eqPurchaseDate").value.trim(),
        price: document.getElementById("eqPrice").value.trim(),
        status: document.getElementById("eqStatus").value,
        url: document.getElementById("eqUrl").value.trim(),
        note: document.getElementById("eqNote").value.trim(),
        photos: JSON.stringify(eqPhotoState)
      };
      var arr = getEqItems();
      var i = arr.findIndex(x=>x.id===obj.id);
      if(i>=0) arr[i] = obj; else arr.push(obj);
      saveEqItems(arr);
      if(window.DB && DB.mode === "cloud"){
        DB.upsert("equipment", obj).then(function(){ location.reload(); })
          .catch(function(e){ alert("云端保存失败：" + e.message + "\n已暂存本机，恢复网络后刷新页面再保存一次即可同步全组。"); location.reload(); });
        return;
      }
      location.reload();
    }
    window.submitEq = submitEq;

    function deleteEq(id){
      var tip = (window.DB && DB.mode === "cloud")
        ? "确定删除这条记录吗？删除后全组都不再显示。"
        : "确定删除这条记录吗？当前是本机草稿模式，删除后仅本浏览器隐藏。";
      if(!confirm(tip)) return;
      if(window.DB && DB.mode === "cloud"){
        DB.remove("equipment", id).then(function(){ location.reload(); })
          .catch(function(e){ alert("云端删除失败：" + e.message); });
        return;
      }
      var official = (window.__officialEq||[]).some(x=>x.id===id);
      saveEqItems(getEqItems().filter(x=>x.id!==id));
      if(official){
        var del = getEqDeleted();
        if(del.indexOf(id)<0){ del.push(id); saveEqDeleted(del); }
      }
      location.reload();
    }
    window.deleteEq = deleteEq;

    /* ---------- 照片功能：自动压缩 + 上传 Supabase Storage + 大图查看 ----------
     * 存储：照片文件存 Supabase Storage 的 equipment-photos 存储桶（公开读），
     *       记录里只存 URL 列表（photos 列，JSON 字符串），免费 1GB 可存上万张。
     * 压缩：选图后先在浏览器里缩到长边约 1000px、转 JPEG，一张约 100KB，
     *       手机拍的大照片也能秒传、打开也快。 */
    var eqPhotoState = [];    // 当前编辑条目的照片 URL 列表
    var eqPhotoBusy = false;  // 是否正在上传（防连点）
    var EQ_PHOTO_MAX = 4;

    function compressImage(file, maxDim, quality){
      return new Promise(function(resolve, reject){
        var img = new Image();
        var objectUrl = URL.createObjectURL(file);
        img.onload = function(){
          try {
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(objectUrl);
            canvas.toBlob(function(blob){
              if(blob) resolve(blob); else reject(new Error("图片压缩失败"));
            }, "image/jpeg", quality);
          } catch(err){ URL.revokeObjectURL(objectUrl); reject(err); }
        };
        img.onerror = function(){ URL.revokeObjectURL(objectUrl); reject(new Error("图片读取失败")); };
        img.src = objectUrl;
      });
    }

    function supabaseBase(){
      return (window.SUPABASE_URL || "").trim()
        .replace(/\/+$/, "").replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
    }
    function uploadEqPhotoBlob(blob){
      var base = supabaseBase(), key = (window.SUPABASE_ANON_KEY || "").trim();
      if(!base || !key) return Promise.reject(new Error("未连接云端，照片无法上传"));
      var path = "equipment/" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
      /* 密钥兼容两代格式：
       *  - 老版 anon key（eyJ… JWT）：Authorization Bearer 与 apikey 头都带
       *  - 新版密钥（sb_publishable_…，不是 JWT）：只带 apikey 头——
       *    Storage 会把 Bearer 头当 JWT 解析，非 JWT 会报 Invalid Compact JWS(403) */
      var isJwt = key.indexOf("eyJ") === 0;
      var headers = { "apikey": key, "Content-Type": "image/jpeg", "x-upsert": "true" };
      if(isJwt) headers["Authorization"] = "Bearer " + key;
      return fetch(base + "/storage/v1/object/equipment-photos/" + path, {
        method: "POST",
        headers: headers,
        body: blob
      }).then(function(r){
        if(!r.ok) return r.text().then(function(t){
          var msg = "照片上传失败(" + r.status + ") " + String(t).slice(0, 140);
          if(r.status === 400 || r.status === 403){
            msg += " —— 常见原因：config.js 里的 SUPABASE_ANON_KEY 填错或不完整。请到 Supabase 控制台 → Settings → API Keys，复制完整的 Publishable / anon key 重新覆盖 config.js 后发布。";
          }
          throw new Error(msg);
        });
        return base + "/storage/v1/object/public/equipment-photos/" + path;
      });
    }

    function renderPhotoList(){
      var wrap = document.getElementById("eqPhotoList");
      var hint = document.getElementById("eqPhotoHint");
      if(!wrap) return;
      wrap.innerHTML = eqPhotoState.map(function(u, i){
        return '<div style="position:relative; width:76px; height:76px;">' +
          '<img src="' + esc(u) + '" style="width:76px; height:76px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:zoom-in;" onclick="showEqPhotoViewerByUrl(\'' + esc(u) + '\')">' +
          '<button type="button" title="移除" onclick="removeEqPhoto(' + i + ')" ' +
          'style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:#e5484d; color:#fff; font-size:12px; line-height:20px; cursor:pointer; padding:0;">×</button>' +
        '</div>';
      }).join("");
      if(hint){
        hint.textContent = eqPhotoBusy ? "⏳ 正在压缩上传…" :
          (eqPhotoState.length >= EQ_PHOTO_MAX ? "已达 " + EQ_PHOTO_MAX + " 张上限" : "");
      }
      var addBtn = wrap.parentElement ? wrap.parentElement.querySelector("button") : null;
    }
    window.renderPhotoList = renderPhotoList;

    function removeEqPhoto(i){
      if(i >= 0 && i < eqPhotoState.length){ eqPhotoState.splice(i, 1); renderPhotoList(); }
    }
    window.removeEqPhoto = removeEqPhoto;

    function handleEqPhotoFiles(files){
      if(!files || !files.length) return;
      var room = EQ_PHOTO_MAX - eqPhotoState.length;
      if(room <= 0){ alert("最多 " + EQ_PHOTO_MAX + " 张照片，如需更换请先点缩略图右上角 × 移除。"); return; }
      var list = Array.prototype.slice.call(files, 0, room);
      if(files.length > room) alert("一次最多再添加 " + room + " 张，超出的已忽略。");
      eqPhotoBusy = true; renderPhotoList();
      var seq = Promise.resolve();
      var failMsgs = [];
      list.forEach(function(f){
        seq = seq.then(function(){
          return compressImage(f, 1000, 0.8).then(function(blob){
            return uploadEqPhotoBlob(blob).then(function(url){
              if(eqPhotoState.length < EQ_PHOTO_MAX) eqPhotoState.push(url);
            });
          }).catch(function(e){ failMsgs.push((f.name || "照片") + "：" + e.message); });
        });
      });
      seq.then(function(){
        eqPhotoBusy = false; renderPhotoList();
        if(failMsgs.length) alert("部分照片没有传上去：\n" + failMsgs.join("\n") + "\n\n（若提示未连接云端，请刷新页面后重试）");
      });
    }
    window.handleEqPhotoFiles = handleEqPhotoFiles;

    /* ---------- 大图查看器 ---------- */
    var eqViewer = document.createElement("div");
    eqViewer.id = "eqPhotoViewer";
    eqViewer.className = "modal";
    eqViewer.innerHTML =
      '<div style="position:relative; max-width:92vw; max-height:92vh; display:flex; align-items:center; justify-content:center;">' +
        '<img id="eqViewerImg" src="" style="max-width:92vw; max-height:86vh; border-radius:10px; box-shadow:0 12px 48px rgba(0,0,0,.35); background:#fff;">' +
        '<button id="eqViewerPrev" onclick="eqViewerStep(-1)" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.92); font-size:18px; cursor:pointer;">‹</button>' +
        '<button id="eqViewerNext" onclick="eqViewerStep(1)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.92); font-size:18px; cursor:pointer;">›</button>' +
        '<button onclick="closeEqViewer()" style="position:absolute; top:-14px; right:-14px; width:34px; height:34px; border-radius:50%; border:none; background:#1f2937; color:#fff; font-size:15px; cursor:pointer;">✕</button>' +
        '<div id="eqViewerCount" style="position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff; font-size:13px; padding:4px 12px; border-radius:99px;"></div>' +
      '</div>';
    document.body.appendChild(eqViewer);
    var eqViewerList = [], eqViewerIdx = 0;

    function showEqPhotoViewerById2(id, list){
      eqViewerList = (list && list.length) ? list : parsePhotos(((window.DATA.equipment||[]).find(function(x){ return x && x.id === id; }) || {}).photos);
      eqViewerIdx = 0;
      if(!eqViewerList.length) return;
      renderEqViewer();
      eqViewer.classList.add("open");
    }
    function showEqPhotoViewer(id){ showEqPhotoViewerById2(id, null); }
    function showEqPhotoViewerByUrl(url){ eqViewerList = [url]; eqViewerIdx = 0; renderEqViewer(); eqViewer.classList.add("open"); }
    function renderEqViewer(){
      var img = document.getElementById("eqViewerImg");
      if(img) img.src = eqViewerList[eqViewerIdx] || "";
      var c = document.getElementById("eqViewerCount");
      if(c) c.textContent = eqViewerList.length > 1 ? (eqViewerIdx + 1) + " / " + eqViewerList.length : "";
      var has2 = eqViewerList.length > 1;
      var pv = document.getElementById("eqViewerPrev"), nx = document.getElementById("eqViewerNext");
      if(pv) pv.style.display = has2 ? "" : "none";
      if(nx) nx.style.display = has2 ? "" : "none";
    }
    function eqViewerStep(d){
      if(!eqViewerList.length) return;
      eqViewerIdx = (eqViewerIdx + d + eqViewerList.length) % eqViewerList.length;
      renderEqViewer();
    }
    function closeEqViewer(){ eqViewer.classList.remove("open"); }
    eqViewer.addEventListener("click", function(ev){ if(ev.target === eqViewer) closeEqViewer(); });
    window.showEqPhotoViewer = showEqPhotoViewer;
    window.showEqPhotoViewerByUrl = showEqPhotoViewerByUrl;
    window.eqViewerStep = eqViewerStep;
    window.closeEqViewer = closeEqViewer;

    /* 照片选择（input change） */
    (function(){
      var inp = document.getElementById("eqPhotoInput");
      if(!inp) return;
      inp.addEventListener("change", function(){
        handleEqPhotoFiles(inp.files);
        inp.value = "";   // 允许重复选择同一文件
      });
    })();

    /* ---------- 导出（备用：自动同步失败时供排查） ---------- */
    function exportEqLocal(){
      var items = getEqItems(), del = getEqDeleted();
      if(!items.length && !del.length){ alert("当前浏览器没有待合并的修改。"); return; }
      document.getElementById("eexBox").value =
        "window.DATA = window.DATA || {};\n" +
        "window.DATA.equipmentOverrides = " + JSON.stringify(items, null, 2) + ";\n" +
        "window.DATA.equipmentDeletions = " + JSON.stringify(del, null, 2) + ";\n";
      document.getElementById("eqExportWrap").classList.add("open");
      document.getElementById("eexBox").select();
    }
    window.exportEqLocal = exportEqLocal;

    function closeEqExport(){ document.getElementById("eqExportWrap").classList.remove("open"); }
    window.closeEqExport = closeEqExport;

    var eqExportWrap = document.createElement("div");
    eqExportWrap.id = "eqExportWrap";
    eqExportWrap.className = "modal";
    eqExportWrap.innerHTML = `<div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本机仪器耗材修改（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeEqExport()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">（备用功能）网站已接入云端：恢复网络后刷新本页，本机修改会<b>自动上传合并到云端</b>，无需发给任何人。仅当自动同步始终失败时，才把下方内容交给网站维护者排查。</p>
        <textarea id="eexBox" rows="14" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>`;
    document.body.appendChild(eqExportWrap);

    /* ---------- 事件绑定 ---------- */
    ["kw","locFilter","statusFilter","sortBy"].forEach(function(elId){
      var elm = document.getElementById(elId);
      elm.addEventListener(elId==="kw" ? "input" : "change", render);
    });
    render();
  </script>
<script src="../assets/js/gate.js?v=3.9"></script>
</body>
