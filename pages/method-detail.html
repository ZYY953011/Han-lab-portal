<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP 详情 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container" id="main"></main>

  <script src="../assets/js/data/methods.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("实验方法");
    var id = getParam("id");
    var m = (window.DATA.methods||[]).find(x=>x.id===id);
    if(!m){ document.getElementById("main").innerHTML = emptyTip("未找到该方法"); }
    else {
      var arr = (a)=> Array.isArray(a)? a.map(esc).join("、") : esc(a);
      document.getElementById("main").innerHTML = `
        <div class="breadcrumb"><a href="../index.html">首页</a> / <a href="methods.html">实验方法</a> / SOP 详情</div>
        <div class="detail-head">
          <h1>${esc(m.name)}</h1>
          <div class="meta">
            <span><b>类型：</b>${esc(m.category)}</span>
            <span><b>版本：</b>${esc(m.version)}</span>
            <span><b>编写人：</b>${esc(m.author)}</span>
            <span><b>更新：</b>${esc(m.updated)}</span>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="section-title" style="margin-top:0;">概要</div>
            <dl class="kv">
              <dt>适用实验</dt><dd>${esc(m.applicableExperiments)}</dd>
              <dt>适用项目</dt><dd>${esc(m.applicableProjects)}</dd>
              <dt>实验目的</dt><dd>${esc(m.purpose)}</dd>
              <dt>所需材料</dt><dd>${arr(m.materials)}</dd>
              <dt>所需仪器</dt><dd>${arr(m.instruments)}</dd>
            </dl>
          </div>
          <div class="card">
            <div class="section-title" style="margin-top:0;">关键参数</div>
            <p>${(m.keyParams||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</p>
            <div class="section-title">附件与视频</div>
            <p>
              ${(m.attachments||[]).map(a=>`<a class="btn btn-sm btn-outline" href="${esc(a.url)}" target="_blank">📎 ${esc(a.name)}</a> `).join("")}
              ${m.videoUrl?`<a class="btn btn-sm btn-outline" href="${esc(m.videoUrl)}" target="_blank">▶ 操作视频</a>`:""}
              ${(!m.attachments&&!m.videoUrl)?"（暂无）":""}
            </p>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;">操作步骤</div>
          <ol>${(m.steps||[]).map(s=>`<li style="margin:6px 0;">${esc(s)}</li>`).join("")}</ol>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0; color:var(--warn);">⚠ 关键注意事项（高亮）</div>
          <div class="note-box">${(m.notes||[]).map(n=>`• ${esc(n)}`).join("<br>")}</div>
        </div>

        <div class="grid grid-2" style="margin-top:16px;">
          <div class="card">
            <div class="section-title" style="margin-top:0;">常见问题</div>
            <div class="section-title" style="font-size:15px;">常见错误</div>
            <ul>${(m.commonErrors||[]).map(e=>`<li>${esc(e)}</li>`).join("")||"<li>暂无</li>"}</ul>
            <div class="section-title" style="font-size:15px;">失败案例</div>
            <ul>${(m.failureCases||[]).map(e=>`<li>${esc(e)}</li>`).join("")||"<li>暂无</li>"}</ul>
            <div class="section-title" style="font-size:15px;">推荐经验</div>
            <ul>${(m.tips||[]).map(e=>`<li>${esc(e)}</li>`).join("")||"<li>暂无</li>"}</ul>
          </div>
          <div class="card">
            <div class="section-title" style="margin-top:0;">参考文献</div>
            <ul>${(m.references||[]).map(r=>`<li>${esc(r)}</li>`).join("")||"<li>暂无</li>"}</ul>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;">版本更新记录（时间轴）</div>
          <div class="timeline">
            ${(m.versionHistory||[]).slice().reverse().map(v=>`
              <div class="tl-item done">
                <div class="tl-title">${esc(v.ver)} <span class="tl-date">${esc(v.date)} · ${esc(v.who)}</span></div>
                <div class="tl-note">${esc(v.note)}</div>
              </div>`).join("")}
          </div>
        </div>
        <p style="margin-top:16px;"><a class="btn btn-outline btn-sm" href="methods.html">← 返回方法列表</a></p>
      `;
    }
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
