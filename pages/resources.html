<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习资源 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.8">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div id="dbBanner"></div>
    <div class="note-box" style="margin-bottom:14px;">💡 设计原则：<b>需要的时候能快速找到，平时不被过量信息干扰。</b>按分类筛选，按需查看。</div>

    <div class="card" style="margin-bottom:14px;">
      <div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <span id="form-title">添加资源</span>
        <button class="btn btn-outline btn-sm local-only-btn" onclick="exportLocalResources()">导出我添加的资源（JSON）</button>
      </div>
      <p id="resHint" style="font-size:13px; color:var(--muted); margin:0 0 10px;">填写名称、网址、分类和简介，点保存后全组实时可见。新增的分类会自动出现在筛选下拉框里。</p>
      <div class="material-add-form" style="margin-bottom:8px;">
        <input type="text" id="res-title" placeholder="资源名称">
        <input type="text" id="res-url" placeholder="网址（可空）" style="flex:2;">
        <input type="text" id="res-addedBy" placeholder="添加人">
        <button class="btn btn-primary btn-sm" id="res-submit-btn" onclick="submitResource()">保存</button>
        <button class="btn btn-outline btn-sm" id="res-cancel-btn" onclick="resetResourceForm()" style="display:none;">取消</button>
        <input type="hidden" id="res-idx" value="">
      </div>
      <div class="material-add-form" style="margin-bottom:8px;">
        <select id="res-cat" style="flex:1; min-width:120px; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">
          <option value="">选择已有分类</option>
        </select>
        <input type="text" id="res-newCat" placeholder="或输入新分类" style="flex:1; min-width:120px;">
        <input type="text" id="res-intro" placeholder="简介 / 用途" style="flex:2; min-width:200px;">
        <select id="res-recommend" style="width:110px; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">
          <option value="★★★★★">★★★★★</option>
          <option value="★★★★">★★★★</option>
          <option value="★★★">★★★</option>
          <option value="★★">★★</option>
          <option value="★">★</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <select id="cat"></select>
      <input class="grow" id="kw" placeholder="搜索资源标题 / 简介…">
    </div>
    <div class="grid grid-3" id="list"></div>
  </main>

  <!-- 导出弹窗 -->
  <div class="modal" id="resExportWrap">
    <div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本地添加的资源（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeResExportBox()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">（备用功能）网站已接入云端：恢复网络后刷新本页，本机修改会<b>自动上传合并到云端</b>，无需发给任何人。仅当自动同步始终失败时，才把下方内容交给网站维护者排查。</p>
        <textarea id="resExportBox" rows="12" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>
  </div>

  <script src="../assets/js/data/resources.js?v=3.8"></script>
  <script src="../assets/js/config.js?v=3.8"></script>
  <script src="../assets/js/app.js?v=3.8"></script>
  <script src="../assets/js/backend.js?v=3.8"></script>
  <script>
    injectHeader("学习资源");
    document.getElementById("head").innerHTML = pageHead(
      "学习资源库", "入组必读、文献检索与管理、翻译润色、科研绘图、数据分析、写作投稿、学术报告、报账指南等，按需取用。",
      [{name:"首页", url:"../index.html"}, {name:"学习资源"}]
    );

    function getLocalResources(){
      try { var raw = localStorage.getItem("resource-local"); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
    }
    function saveLocalResources(arr){
      localStorage.setItem("resource-local", JSON.stringify(arr));
    }
    function getLocalDeleted(){
      try { var raw = localStorage.getItem("resource-deleted"); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
    }
    function saveLocalDeleted(arr){
      localStorage.setItem("resource-deleted", JSON.stringify(arr));
    }
    /* 老数据没有 id：按标题生成稳定 id（同一标题在所有设备上生成相同 id，避免重复） */
    function ensureIds(list){
      (list||[]).forEach(function(r){
        if(r && !r.id) r.id = "R-" + encodeURIComponent(r.title || r.category || "res").replace(/%/g,"").slice(0,32);
      });
    }
    /* 应用本机修改（合并进全量列表，须在渲染前执行） */
    (function applyLocal(){
      var list = window.DATA.resources = window.DATA.resources || [];
      ensureIds(list);
      ensureIds(getLocalResources());
      getLocalResources().forEach(function(p){
        if(!p || !p.id) return;
        var i = list.findIndex(function(x){ return x.id === p.id; });
        if(i>=0) list[i] = Object.assign({}, list[i], p); else list.push(p);
      });
      var del = getLocalDeleted();
      if(del.length) window.DATA.resources = list.filter(function(r){ return del.indexOf(r.id)<0; });
    })();

    function getCategories(){
      return [...new Set((window.DATA.resources||[]).map(r => r.category).filter(Boolean))].sort();
    }

    function updateCatSelect(){
      var cats = getCategories();
      document.getElementById("cat").innerHTML = '<option value="">全部分类</option>' + cats.map(c=>'<option>'+esc(c)+'</option>').join("");
      var resCat = document.getElementById("res-cat");
      resCat.innerHTML = '<option value="">选择已有分类</option>' + cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");
    }

    function card(r){
      var actions = '<div style="display:flex; gap:6px; margin-top:8px;">' +
        '<button class="btn btn-xs btn-outline" onclick="editResource(\'' + esc(r.id) + '\')">编辑</button>' +
        '<button class="btn btn-xs btn-danger" onclick="deleteResource(\'' + esc(r.id) + '\')">删除</button>' +
        '</div>';
      var titleHtml = r.url
        ? '<a href="' + esc(r.url) + '" target="_blank">' + esc(r.title) + '</a>'
        : '<span style="color:var(--text);">' + esc(r.title) + '</span>';
      return '<div class="card">' +
        '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
          '<h3 style="font-size:16px; color:var(--primary-dark); line-height:1.35;">' + titleHtml + '</h3>' +
          '<span style="color:var(--warn); font-size:13px; white-space:nowrap;">' + esc(r.recommend) + '</span>' +
        '</div>' +
        '<div style="margin:4px 0;"><span class="tag">' + esc(r.category) + '</span></div>' +
        '<p style="font-size:13.5px; color:#44505f;">' + esc(r.intro) + '</p>' +
        '<div style="font-size:12.5px; color:var(--muted); margin:6px 0;">' +
          '适合：' + esc(r.forWho || "—") + ' ｜ 约 ' + esc(r.minutes || "—") + ' 分钟' +
        '</div>' +
        actions +
      '</div>';
    }

    function render(){
      var cat = document.getElementById("cat").value;
      var kw = document.getElementById("kw").value.trim().toLowerCase();
      var list = (window.DATA.resources||[]).filter(function(r){
        var ok1 = !cat || r.category===cat;
        var ok2 = !kw || ((r.title||"")+(r.intro||"")+(r.category||"")).toLowerCase().includes(kw);
        return ok1 && ok2;
      });
      document.getElementById("list").innerHTML = list.length ? list.map(card).join("") : emptyTip("没有匹配的资源");
    }

    function nextResId(){
      var max = 0;
      (window.DATA.resources||[]).forEach(function(x){
        var m = /^R(\d+)$/.exec(x.id||"");
        if(m) max = Math.max(max, parseInt(m[1],10));
      });
      return "R" + String(max+1).padStart(3,"0");
    }

    function submitResource(){
      var id = document.getElementById("res-idx").value.trim();
      var title = document.getElementById("res-title").value.trim();
      var url = document.getElementById("res-url").value.trim();
      var cat = document.getElementById("res-cat").value.trim();
      var newCat = document.getElementById("res-newCat").value.trim();
      var intro = document.getElementById("res-intro").value.trim();
      var recommend = document.getElementById("res-recommend").value;
      var addedBy = document.getElementById("res-addedBy").value.trim();

      if(!title){ alert("请填写资源名称"); return; }
      var category = newCat || cat || "其他";
      if(!intro){ intro = "—"; }

      /* 编辑时以现有条目打底，避免丢失表单之外的旧字段 */
      var existing = id ? (window.DATA.resources||[]).find(function(x){ return x.id===id; }) : null;
      var item = Object.assign({}, existing || {}, {
        id: id || nextResId(),
        title: title, url: url, category: category, intro: intro,
        forWho: addedBy || "—", when: (existing && existing.when) || "随时",
        minutes: (existing && existing.minutes) || 5,
        recommend: recommend, addedBy: addedBy || "—"
      });
      var saveBtn = document.getElementById("res-submit-btn");
      var restoreBtn = function(){ saveBtn.disabled = false; saveBtn.textContent = "保存"; };
      /* 云端实时：保存后全组立即可见 */
      if(window.DB && DB.mode === "cloud"){
        try{
          saveBtn.disabled = true; saveBtn.textContent = "保存中…";
          DB.upsert("resources", item).then(function(){
            location.reload();
          }).catch(function(e){
            restoreBtn();
            alert("云端保存失败：" + e.message + "\n已暂存本机，恢复网络后重新点一次保存即可同步全组。");
            saveLocalResource(item);
          });
          return;
        }catch(err){ restoreBtn(); alert("保存出错：" + (err && err.message || err)); }
      }
      saveLocalResource(item);
    }
    function saveLocalResource(item){
      var arr = getLocalResources();
      var i = arr.findIndex(function(x){ return x.id === item.id; });
      if(i>=0) arr[i] = item; else arr.push(item);
      saveLocalResources(arr);
      location.reload();
    }
    window.submitResource = submitResource;

    function deleteResource(id){
      var tip = (window.DB && DB.mode === "cloud")
        ? "确定删除这条资源吗？删除后全组都不再显示。"
        : "确定删除这条资源吗？当前是本机草稿模式，删除后仅本浏览器隐藏；恢复云端后可重新同步。";
      if(!confirm(tip)) return;
      /* 云端实时：删除后全组都不再显示 */
      if(window.DB && DB.mode === "cloud"){
        DB.remove("resources", id).then(function(){ location.reload(); })
          .catch(function(e){
            alert("云端删除失败：" + e.message + "\n已先在本机隐藏，恢复网络后可重新删除。");
            saveLocalResources(getLocalResources().filter(function(x){ return x.id !== id; }));
            location.reload();
          });
        return;
      }
      var official = (window.DATA.resources||[]).some(function(x){ return x.id === id; });
      saveLocalResources(getLocalResources().filter(function(x){ return x.id !== id; }));
      if(official){
        var del = getLocalDeleted();
        if(del.indexOf(id)<0){ del.push(id); saveLocalDeleted(del); }
      }
      location.reload();
    }
    window.deleteResource = deleteResource;

    function editResource(id){
      var r = (window.DATA.resources||[]).find(function(x){ return x.id === id; });
      if(!r) return;
      document.getElementById("res-title").value = r.title || "";
      document.getElementById("res-url").value = r.url || "";
      document.getElementById("res-cat").value = r.category || "";
      document.getElementById("res-newCat").value = "";
      document.getElementById("res-intro").value = (r.intro === "—" ? "" : (r.intro || ""));
      document.getElementById("res-recommend").value = r.recommend || "★★★★★";
      document.getElementById("res-addedBy").value = (r.addedBy === "—" ? "" : (r.addedBy || ""));
      document.getElementById("res-idx").value = r.id || "";
      document.getElementById("res-submit-btn").textContent = "更新";
      document.getElementById("res-cancel-btn").style.display = "";
      document.getElementById("form-title").textContent = "编辑资源";
      document.getElementById("res-title").focus();
    }
    window.editResource = editResource;

    function resetResourceForm(){
      document.getElementById("res-title").value = "";
      document.getElementById("res-url").value = "";
      document.getElementById("res-cat").value = "";
      document.getElementById("res-newCat").value = "";
      document.getElementById("res-intro").value = "";
      document.getElementById("res-recommend").value = "★★★★★";
      document.getElementById("res-addedBy").value = "";
      document.getElementById("res-idx").value = "";
      document.getElementById("res-submit-btn").textContent = "保存";
      document.getElementById("res-cancel-btn").style.display = "none";
      document.getElementById("form-title").textContent = "添加资源";
    }
    window.resetResourceForm = resetResourceForm;

    function exportLocalResources(){
      var arr = getLocalResources();
      if(!arr.length){ alert("当前浏览器没有临时添加的资源"); return; }
      document.getElementById("resExportBox").value = JSON.stringify(arr, null, 2);
      document.getElementById("resExportWrap").classList.add("open");
      document.getElementById("resExportBox").select();
    }
    window.exportLocalResources = exportLocalResources;

    function closeResExportBox(){
      document.getElementById("resExportWrap").classList.remove("open");
    }
    window.closeResExportBox = closeResExportBox;

    updateCatSelect();
    document.getElementById("cat").addEventListener("change", render);
    document.getElementById("kw").addEventListener("input", render);
    render();

    // ---------- 云端实时模式：连接后拉取全组数据并重渲染 ----------
    var __cloudReady = (window.DB ? DB.ready() : Promise.resolve("local"));
    __cloudReady.then(function(mode){
      var el = document.getElementById("dbBanner");
      if(el && window.DB) el.innerHTML = DB.statusBanner();
      var hint = document.getElementById("resHint");
      if(mode !== "cloud"){
        if(hint) hint.innerHTML = '⚠ 本机草稿模式（云端未连接）：修改只在本浏览器可见。可能是网络波动，刷新页面可重试；恢复云端后本机修改会自动同步全组。';
        if(hint) hint.style.color = "#b45309";
        return;
      }
      if(hint) hint.innerHTML = '🟢 云端实时模式：添加/编辑/删除保存后<b>全组立即可见</b>（手机/其他电脑打开都一样）。';
      return DB.hydrate("resources", "resources").then(function(){
        updateCatSelect();
        render();
      });
    }).catch(function(){});
  </script>
<script src="../assets/js/gate.js?v=3.8"></script>
</body>
</html>
