<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生培养 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="note-box" style="margin-bottom:14px;">💡 覆盖学生从入组到毕业全过程。下方时间轴展示各培养节点的计划/实际完成日期与状态，临近节点自动提醒。每位成员可在「开题、中期考核、预答辩、毕业答辩」节点查看或上传培养资料（链接基于飞书云盘权限）。</div>

    <div class="section-title">即将到期提醒</div>
    <div id="remind"></div>

    <div class="section-title">学生列表</div>
    <div class="grid grid-2" id="list"></div>

    <div class="section-title">培养进度总览</div>
    <div class="table-wrap" style="margin-top:8px;">
      <table>
        <thead><tr><th>姓名</th><th>类型</th><th>导师</th><th>研究方向</th><th>预计毕业</th><th>当前阶段</th><th>操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/js/data/students.js"></script>
  <script src="../assets/js/data/student-materials.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("学生培养");
    document.getElementById("head").innerHTML = pageHead(
      "学生培养", "覆盖入组 → 培养计划 → 开题 → 中期 → 预答辩 → 毕业答辩 → 学位材料 → 毕业全过程。",
      [{name:"首页", url:"../index.html"}, {name:"学生培养"}]
    );

    var students = window.DATA.students||[];
    function currentStage(s){
      var cur = s.stages.find(st=> st.status!=="已完成") || s.stages[s.stages.length-1];
      return cur;
    }

    // 即将到期提醒：状态为“准备中 / 需要修改 / 未开始”且计划日期在近期的
    var upcoming = [];
    students.forEach(s=> s.stages.forEach(st=>{
      if((st.status==="准备中"||st.status==="需要修改") && st.plan) upcoming.push({name:s.name, stage:st.name, plan:st.plan, note:st.note});
    }));
    document.getElementById("remind").innerHTML = upcoming.length
      ? `<div class="warn-box">⏰ 待推进节点（${upcoming.length}）：` +
        upcoming.map(u=>`${esc(u.name)} 的「${esc(u.stage)}」计划 ${esc(u.plan)}`).join("；") + `</div>`
      : `<div class="placeholder">暂无临近节点</div>`;

    // 卡片
    document.getElementById("list").innerHTML = students.map(s=>{
      var cur = currentStage(s);
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h3 style="font-size:17px; color:var(--primary-dark);">${esc(s.name)}</h3>
          ${badge(s.type)}
        </div>
        <div style="color:var(--muted); font-size:13px; margin:6px 0;">导师：${esc(s.tutor)} ｜ 方向：${esc(s.research)} ｜ 项目：${esc(s.project)}</div>
        <div style="font-size:13.5px;">当前阶段：<b>${esc(cur.name)}</b> ${badge(cur.status)}</div>
        <div style="margin-top:8px;"><a class="btn btn-sm" href="#${esc(s.id)}" onclick="showTimeline('${esc(s.id)}')">查看培养时间轴 →</a></div>
      </div>`;
    }).join("");

    // 总览表
    document.getElementById("rows").innerHTML = students.map(s=>{
      var cur = currentStage(s);
      return `<tr>
        <td><a href="#${esc(s.id)}" onclick="showTimeline('${esc(s.id)}')">${esc(s.name)}</a></td>
        <td>${badge(s.type)}</td><td>${esc(s.tutor)}</td><td>${esc(s.research)}</td>
        <td>${esc(s.expectGrad)}</td><td>${esc(cur.name)} ${badge(cur.status)}</td>
        <td><button class="btn btn-sm" onclick="showTimeline('${esc(s.id)}')">时间轴</button></td>
      </tr>`;
    }).join("");

    var box = document.createElement("div");
    box.id = "tlBox";
    document.querySelector(".container").appendChild(box);

    // 添加材料弹窗
    var modal = document.createElement("div");
    modal.id = "matModal";
    modal.className = "modal";
    modal.innerHTML = `<div class="modal-box">
      <div class="modal-head"><b class="modal-title">添加材料</b><button class="btn btn-sm btn-outline" onclick="closeMaterialModal()">关闭</button></div>
      <div class="modal-body">
        <label>版本 / 材料类型</label><input type="text" id="matVersion" value="v1">
        <label>资料名称 <span style="color:red">*</span></label><input type="text" id="matTitle" placeholder="如：开题报告初稿">
        <label>资料链接（飞书云盘） <span style="color:red">*</span></label><input type="text" id="matUrl" placeholder="https://my.feishu.cn/file/... 或 https://my.feishu.cn/drive/folder/...">
        <label>日期</label><input type="text" id="matDate" placeholder="YYYY-MM-DD">
        <label>备注</label><input type="text" id="matNote" placeholder="可选">
        <div style="margin-top:12px;">
          <button class="btn btn-primary" onclick="submitMaterial()">保存</button>
          <button class="btn btn-outline" onclick="closeMaterialModal()" style="margin-left:8px;">取消</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(modal);

    // 导出 JSON 弹窗
    var exportWrap = document.createElement("div");
    exportWrap.className = "modal";
    exportWrap.innerHTML = `<div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本地添加的材料（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeExportBox()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">复制下方内容，交给管理员贴入 <code>assets/js/data/student-materials.js</code>，即可让全组可见。</p>
        <textarea id="exportBox" rows="12" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>`;
    document.body.appendChild(exportWrap);

    var materialStages = ["开题", "中期考核", "预答辩", "毕业答辩"];

    function lsKey(id, stage){ return "training-materials-" + id + "-" + stage; }

    function getLocalMaterials(id, stage){
      try {
        var raw = localStorage.getItem(lsKey(id, stage));
        return raw ? JSON.parse(raw) : [];
      } catch(e){ return []; }
    }

    function saveLocalMaterial(id, stage, item){
      var arr = getLocalMaterials(id, stage);
      arr.push(item);
      localStorage.setItem(lsKey(id, stage), JSON.stringify(arr));
    }

    function renderMaterialBlock(s, st){
      var locals = getLocalMaterials(s.id, st.name);
      var all = (st.materials || []).concat(locals);
      var hasFeishu = st.feishu && st.feishu.indexOf("PASTE_FEISHU_LINK") === -1;
      var isMatStage = materialStages.indexOf(st.name) !== -1;
      if (!isMatStage && !all.length && !hasFeishu) return "";

      var listHtml = all.map(function(m){
        return `<div class="material-item">
          <span class="material-version">${esc(m.version || "资料")}</span>
          ${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title || "打开链接")}</a>` : `<span>${esc(m.title || "")}</span>`}
          <span class="material-date">${esc(m.date || "")}</span>
          ${m.note ? `<span class="material-note">${esc(m.note)}</span>` : ""}
        </div>`;
      }).join("");

      return `<div class="material-block">
        <div class="material-head">
          <span>📎 培养材料</span>
          <span style="flex:1;"></span>
          ${hasFeishu ? `<a class="btn btn-sm btn-outline feishu-btn" href="${esc(st.feishu)}" target="_blank" rel="noopener">📤 去飞书查看/上传 ↗</a>` : ""}
          ${isMatStage ? `<button class="btn btn-sm" onclick="openMaterialModal('${esc(s.id)}','${esc(st.name)}')">＋ 添加材料</button>` : ""}
        </div>
        ${all.length ? `<div class="material-list">${listHtml}</div>` : `<div class="material-empty">暂无资料，点击「添加材料」或去飞书云盘上传。</div>`}
      </div>`;
    }

    function showTimeline(id){
      var s = students.find(x=>x.id===id);
      if(!s) return;
      box.innerHTML = `<div class="card" style="margin-top:18px; border-color:var(--primary);">
        <div class="section-title" style="margin-top:0;">${esc(s.name)} 的培养时间轴</div>
        <dl class="kv" style="margin-bottom:12px;">
          <dt>学号</dt><dd>${esc(s.studentId)}</dd>
          <dt>类型</dt><dd>${esc(s.type)}</dd>
          <dt>入学/入组</dt><dd>${esc(s.enroll)} / ${esc(s.join)}</dd>
          <dt>预计毕业</dt><dd>${esc(s.expectGrad)}</dd>
          ${s.tutor?`<dt>导师</dt><dd>${esc(s.tutor)}</dd>`:""}
        </dl>
        <div class="timeline">
          ${s.stages.map(st=>`
            <div class="tl-item ${st.done?"done":(st.status==="需要修改"?"warn":"")}">
              <div class="tl-title">${esc(st.name)} ${badge(st.status)}
                <span class="tl-date">计划 ${esc(st.plan||"—")} ｜ 实际 ${esc(st.actual||"—")}</span></div>
              ${st.advice?`<div class="tl-note">导师意见：${esc(st.advice)}</div>`:""}
              ${st.note?`<div class="tl-note" style="color:var(--muted);">备注：${esc(st.note)}</div>`:""}
              ${renderMaterialBlock(s, st)}
            </div>`).join("")}
        </div>
        <p style="margin-top:8px;">
          <a class="btn btn-outline btn-sm" href="javascript:void(0)" onclick="document.getElementById('tlBox').innerHTML=''">收起</a>
          <a class="btn btn-outline btn-sm" href="javascript:void(0)" onclick="exportLocalMaterials()">导出我添加的材料（JSON）</a>
        </p>
      </div>`;
      box.scrollIntoView({behavior:"smooth"});
    }
    window.showTimeline = showTimeline;

    function openMaterialModal(id, stage){
      var s = students.find(x=>x.id===id);
      if(!s) return;
      var modal = document.getElementById("matModal");
      modal.dataset.id = id;
      modal.dataset.stage = stage;
      modal.querySelector(".modal-title").textContent = s.name + " · " + stage + " · 添加材料";
      modal.querySelector("#matVersion").value = "v1";
      modal.querySelector("#matTitle").value = "";
      modal.querySelector("#matUrl").value = "";
      modal.querySelector("#matDate").value = new Date().toISOString().slice(0,10);
      modal.querySelector("#matNote").value = "";
      modal.classList.add("open");
    }
    window.openMaterialModal = openMaterialModal;

    function closeMaterialModal(){
      document.getElementById("matModal").classList.remove("open");
    }
    window.closeMaterialModal = closeMaterialModal;

    function submitMaterial(){
      var modal = document.getElementById("matModal");
      var id = modal.dataset.id;
      var stage = modal.dataset.stage;
      var item = {
        version: modal.querySelector("#matVersion").value.trim() || "v1",
        title: modal.querySelector("#matTitle").value.trim() || "未命名资料",
        url: modal.querySelector("#matUrl").value.trim(),
        date: modal.querySelector("#matDate").value.trim(),
        note: modal.querySelector("#matNote").value.trim()
      };
      if(!item.url){
        alert("请填写资料链接（飞书云盘链接）");
        return;
      }
      saveLocalMaterial(id, stage, item);
      closeMaterialModal();
      showTimeline(id);
    }
    window.submitMaterial = submitMaterial;

    function exportLocalMaterials(){
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("training-materials-")===0){
          var parts = k.replace("training-materials-","").split("-");
          var stage = parts.pop();
          var id = parts.join("-");
          if(!out[id]) out[id] = {};
          out[id][stage] = JSON.parse(localStorage.getItem(k));
        }
      }
      var json = JSON.stringify(out, null, 2);
      var textarea = document.getElementById("exportBox");
      textarea.value = "// 将以下内容贴入 assets/js/data/student-materials.js 的对应成员 stages 下，\n// 即可让所有人看到本地添加的材料。\n" + json;
      textarea.parentElement.classList.add("open");
      textarea.select();
    }
    window.exportLocalMaterials = exportLocalMaterials;

    function closeExportBox(){
      document.getElementById("exportBox").parentElement.classList.remove("open");
    }
    window.closeExportBox = closeExportBox;
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
