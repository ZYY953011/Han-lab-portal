<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生培养 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="note-box" style="margin-bottom:14px;">💡 覆盖入组 → 培养计划 → 开题 → 中期 → 预答辩 → 毕业答辩 → 学位材料 → 毕业全过程。点击表格行可展开完整时间轴与培养材料。</div>

    <div class="section-title">培养概况</div>
    <div class="stat-row" id="stats" style="margin-bottom:10px;"></div>

    <div class="section-title">即将到期提醒</div>
    <div id="remind"></div>

    <div class="section-title">培养进度总览</div>
    <div class="note-box" style="margin-bottom:8px; font-size:13px;">
      💡 阶段时间按「硕士入学当年 12 月开题、第 2 年 12 月中期、第 3 年答辩；博士第 2 学期开题、第 4 学期中期、第 8 学期答辩」自动推算。
      如有专项计划等特殊情况，管理员可在 <code>assets/js/data/student-materials.js</code> 的 <code>studentStageOverrides</code> 中手动覆盖。
    </div>
    <div class="toolbar" id="toolbar" style="margin-top:8px;">
      <span style="font-size:13.5px; color:var(--muted);">筛选：</span>
      <button class="btn btn-sm filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="btn btn-sm filter-btn btn-outline" data-filter="开题" onclick="setFilter('开题')">待开题</button>
      <button class="btn btn-sm filter-btn btn-outline" data-filter="中期考核" onclick="setFilter('中期考核')">待中期考核</button>
      <button class="btn btn-sm filter-btn btn-outline" data-filter="预答辩" onclick="setFilter('预答辩')">待预答辩</button>
      <button class="btn btn-sm filter-btn btn-outline" data-filter="毕业答辩" onclick="setFilter('毕业答辩')">待正式答辩</button>
      <button class="btn btn-sm btn-outline" onclick="exportLocalMaterials()">导出我添加的材料（JSON）</button>
      <button class="btn btn-sm btn-outline" onclick="exportStageOverrides()">导出状态修改（JSON）</button>
    </div>
    <div class="table-wrap" style="margin-top:8px;">
      <table>
        <thead><tr><th style="width:36px;"></th><th>姓名</th><th>类型</th><th>导师</th><th>研究方向</th><th>预计毕业</th><th>当前阶段</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/js/data/members.js"></script>
  <script src="../assets/js/data/students.js"></script>
  <script src="../assets/js/data/student-materials.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("学生培养");
    document.getElementById("head").innerHTML = pageHead(
      "学生培养", "覆盖入组 → 培养计划 → 开题 → 中期 → 预答辩 → 毕业答辩 → 学位材料 → 毕业全过程。",
      [{name:"首页", url:"../index.html"}, {name:"学生培养"}]
    );

    var students = window.DATA.students||[];
    var currentFilter = 'all';
    var openedRows = new Set();
    var studentsBase = JSON.parse(JSON.stringify(students)); // 基线（含管理员 overrides）

    // 应用本浏览器中组员/管理员手动设置的阶段状态
    function applyLocalOverrides() {
      students.forEach(function (s, i) {
        if (studentsBase[i]) s.stages = JSON.parse(JSON.stringify(studentsBase[i].stages));
      });
      students.forEach(function (s) {
        var raw = localStorage.getItem('training-override-' + s.id);
        if (!raw) return;
        try {
          var ov = JSON.parse(raw);
          Object.keys(ov).forEach(function (name) {
            var st = s.stages.find(function (x) { return x.name === name; });
            if (!st) return;
            Object.assign(st, ov[name]);
            st.done = (st.status === "已完成");
          });
        } catch (e) {}
      });
    }
    window.applyLocalOverrides = applyLocalOverrides;

    function currentStage(s){
      var cur = s.stages.find(st=> st.status!=="已完成") || s.stages[s.stages.length-1];
      return cur;
    }

    function countBy(pred){ return students.filter(pred).length; }

    // 统计
    var total = students.length;
    var active = countBy(s=>s.status==="在籍在校");
    var phd = countBy(s=>/博士/.test(s.type) && !/博士后/.test(s.type));
    var master = countBy(s=>/硕士/.test(s.type));
    var postdoc = countBy(s=>/博士后/.test(s.type));
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="num">${total}</div><div class="lab">培养对象总数</div></div>
      <div class="stat"><div class="num">${active}</div><div class="lab">在读 / 在站</div></div>
      <div class="stat"><div class="num">${phd}</div><div class="lab">博士生</div></div>
      <div class="stat"><div class="num">${master}</div><div class="lab">硕士生</div></div>
      ${postdoc?`<div class="stat"><div class="num">${postdoc}</div><div class="lab">博士后</div></div>`:""}
    `;

    // 即将到期提醒：状态为“准备中 / 需要修改”且计划日期在近期的
    var upcoming = [];
    students.forEach(s=> s.stages.forEach(st=>{
      if((st.status==="准备中"||st.status==="需要修改") && st.plan) upcoming.push({name:s.name, stage:st.name, plan:st.plan, note:st.note});
    }));
    document.getElementById("remind").innerHTML = upcoming.length
      ? `<div class="warn-box">⏰ 待推进节点（${upcoming.length}）：` +
        upcoming.slice(0,8).map(u=>`${esc(u.name)} 的「${esc(u.stage)}」计划 ${esc(u.plan)}`).join("；") +
        (upcoming.length>8?` …… 等共 ${upcoming.length} 人` : "") + `</div>`
      : `<div class="placeholder">暂无临近节点</div>`;

    function renderTable(){
      var filtered = students.filter(s=>{
        if(currentFilter==='all') return true;
        var cur = currentStage(s);
        return cur.name === currentFilter;
      });

      document.getElementById("rows").innerHTML = filtered.map(s=>{
        var cur = currentStage(s);
        var isOpen = openedRows.has(s.id);
        return `<tr id="row-${esc(s.id)}">
          <td><button class="btn btn-sm btn-icon" onclick="toggleRow('${esc(s.id)}')">${isOpen?'−':'+'}</button></td>
          <td><b>${esc(s.name)}</b></td>
          <td>${badge(s.type)}</td>
          <td>${esc(s.tutor)}</td>
          <td>${esc(s.research)}</td>
          <td>${esc(s.expectGrad)}</td>
          <td>${esc(cur.name)} ${badge(cur.status)}</td>
        </tr>`;
      }).join("");

      // 重新渲染已展开行
      openedRows.forEach(function(id){
        if(filtered.find(s=>s.id===id)) renderDetail(id);
      });

      // 更新筛选按钮状态
      document.querySelectorAll('.filter-btn').forEach(function(btn){
        if(btn.dataset.filter === currentFilter){
          btn.classList.add('active'); btn.classList.remove('btn-outline');
        } else {
          btn.classList.remove('active'); btn.classList.add('btn-outline');
        }
      });
    }
    window.renderTable = renderTable;

    function setFilter(filter){
      currentFilter = filter;
      renderTable();
    }
    window.setFilter = setFilter;

    function toggleRow(id){
      var detail = document.getElementById('detail-' + id);
      if(detail){
        detail.remove();
        openedRows.delete(id);
        var btn = document.querySelector('#row-' + esc(id) + ' .btn-icon');
        if(btn) btn.textContent = '+';
      } else {
        openedRows.add(id);
        renderDetail(id);
      }
    }
    window.toggleRow = toggleRow;

    var materialStages = ["开题", "中期考核", "预答辩", "毕业答辩"];

    function lsKey(id, stage){ return "training-materials-" + id + "-" + stage; }

    function getLocalMaterials(id, stage){
      try {
        var raw = localStorage.getItem(lsKey(id, stage));
        return raw ? JSON.parse(raw) : [];
      } catch(e){ return []; }
    }

    function saveLocalMaterial(id, stage, item){
      var arr = getLocalMaterials(id, stage);
      arr.push(item);
      localStorage.setItem(lsKey(id, stage), JSON.stringify(arr));
    }

    function renderMaterialBlock(s, st){
      var locals = getLocalMaterials(s.id, st.name);
      var all = (st.materials || []).concat(locals);
      var hasFeishu = st.feishu && st.feishu.indexOf("PASTE_FEISHU_LINK") === -1;
      var isMatStage = materialStages.indexOf(st.name) !== -1;
      if (!isMatStage && !all.length && !hasFeishu) return "";

      var listHtml = all.map(function(m){
        return `<div class="material-item">
          <span class="material-version">${esc(m.version || "资料")}</span>
          ${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title || "打开链接")}</a>` : `<span>${esc(m.title || "")}</span>`}
          <span class="material-date">${esc(m.date || "")}</span>
          ${m.note ? `<span class="material-note">${esc(m.note)}</span>` : ""}
        </div>`;
      }).join("");

      return `<div class="material-block">
        <div class="material-head">
          <span>📎 培养材料</span>
          <span style="flex:1;"></span>
          ${hasFeishu ? `<a class="btn btn-sm btn-outline feishu-btn" href="${esc(st.feishu)}" target="_blank" rel="noopener">📤 去飞书查看/上传 ↗</a>` : ""}
          ${isMatStage ? `<button class="btn btn-sm" onclick="openMaterialModal('${esc(s.id)}','${esc(st.name)}')">＋ 添加材料</button>` : ""}
        </div>
        ${all.length ? `<div class="material-list">${listHtml}</div>` : `<div class="material-empty">暂无资料，点击「添加材料」或去飞书云盘上传。</div>`}
      </div>`;
    }

    function renderDetail(id){
      var s = students.find(x=>x.id===id);
      if(!s) return;
      var row = document.getElementById('row-' + id);
      if(!row) return;

      var detailTr = document.createElement('tr');
      detailTr.id = 'detail-' + id;
      detailTr.className = 'detail-row';
      detailTr.innerHTML = `<td colspan="7">
        <div class="detail-inner">
          <dl class="kv" style="margin-bottom:12px;">
            <dt>学号</dt><dd>${esc(s.studentId)}</dd>
            <dt>类型</dt><dd>${esc(s.type)}</dd>
            <dt>入学/入组</dt><dd>${esc(s.enroll)} / ${esc(s.join)}</dd>
            <dt>预计毕业</dt><dd>${esc(s.expectGrad)}</dd>
            ${s.tutor?`<dt>导师</dt><dd>${esc(s.tutor)}</dd>`:""}
          </dl>
          <div class="timeline">
            ${s.stages.map(st=>`
              <div class="tl-item ${st.done?"done":(st.status==="需要修改"?"warn":"")}">
                <div class="tl-title">${esc(st.name)} ${badge(st.status)}
                  <span class="tl-date">计划 ${esc(st.plan||"—")} ｜ 实际 ${esc(st.actual||"—")}</span>
                  <button class="btn btn-xs btn-outline tl-edit" onclick="openStageModal('${esc(s.id)}','${esc(st.name)}')">✎ 设置</button></div>
                ${st.advice?`<div class="tl-note">导师意见：${esc(st.advice)}</div>`:""}
                ${st.note?`<div class="tl-note" style="color:var(--muted);">备注：${esc(st.note)}</div>`:""}
                ${renderMaterialBlock(s, st)}
              </div>`).join("")}
          </div>
        </div>
      </td>`;

      row.parentNode.insertBefore(detailTr, row.nextSibling);
      var btn = row.querySelector('.btn-icon');
      if(btn) btn.textContent = '−';
    }

    // 添加材料弹窗
    var modal = document.createElement("div");
    modal.id = "matModal";
    modal.className = "modal";
    modal.innerHTML = `<div class="modal-box">
      <div class="modal-head"><b class="modal-title">添加材料</b><button class="btn btn-sm btn-outline" onclick="closeMaterialModal()">关闭</button></div>
      <div class="modal-body">
        <label>版本 / 材料类型</label><input type="text" id="matVersion" value="v1">
        <label>资料名称 <span style="color:red">*</span></label><input type="text" id="matTitle" placeholder="如：开题报告初稿">
        <label>资料链接（飞书云盘） <span style="color:red">*</span></label><input type="text" id="matUrl" placeholder="https://my.feishu.cn/file/... 或 https://my.feishu.cn/drive/folder/...">
        <label>日期</label><input type="text" id="matDate" placeholder="YYYY-MM-DD">
        <label>备注</label><input type="text" id="matNote" placeholder="可选">
        <div style="margin-top:12px;">
          <button class="btn btn-primary" onclick="submitMaterial()">保存</button>
          <button class="btn btn-outline" onclick="closeMaterialModal()" style="margin-left:8px;">取消</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(modal);

    // 导出 JSON 弹窗
    var exportWrap = document.createElement("div");
    exportWrap.className = "modal";
    exportWrap.innerHTML = `<div class="modal-box" style="max-width:720px;">
      <div class="modal-head"><b>导出本地添加的材料（JSON）</b><button class="btn btn-sm btn-outline" onclick="closeExportBox()">关闭</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">复制下方内容，交给管理员贴入 <code>assets/js/data/student-materials.js</code>，即可让全组可见。</p>
        <textarea id="exportBox" rows="12" style="width:100%; font-family:monospace; font-size:12px;"></textarea>
      </div>
    </div>`;
    document.body.appendChild(exportWrap);

    // 设置阶段状态弹窗
    var stageModal = document.createElement("div");
    stageModal.id = "stageModal";
    stageModal.className = "modal";
    stageModal.innerHTML = `<div class="modal-box" style="max-width:460px;">
      <div class="modal-head"><b class="modal-title">设置培养状态</b><button class="btn btn-sm btn-outline" onclick="closeStageModal()">关闭</button></div>
      <div class="modal-body">
        <label>状态</label>
        <select id="stageStatus" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
          <option value="未开始">未开始</option>
          <option value="准备中">准备中</option>
          <option value="已完成">已完成</option>
          <option value="需要修改">需要修改</option>
        </select>
        <label>实际完成日期（可选，如 2026-05-20）</label>
        <input type="text" id="stageActual" placeholder="YYYY-MM-DD">
        <label>备注（可选）</label>
        <input type="text" id="stageNote" placeholder="如：延迟毕业，按实际进度更新">
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="submitStageOverride()">保存</button>
          <button class="btn btn-outline" onclick="resetStageOverride()">恢复自动</button>
          <button class="btn btn-outline" onclick="closeStageModal()">取消</button>
        </div>
        <p style="font-size:12px; color:var(--muted); margin-top:10px;">设置仅保存在本浏览器，刷新或换设备不保留。管理员可在筛选栏点「导出状态修改（JSON）」收集后合并到全站。</p>
      </div>
    </div>`;
    document.body.appendChild(stageModal);

    function openMaterialModal(id, stage){
      var s = students.find(x=>x.id===id);
      if(!s) return;
      var modal = document.getElementById("matModal");
      modal.dataset.id = id;
      modal.dataset.stage = stage;
      modal.querySelector(".modal-title").textContent = s.name + " · " + stage + " · 添加材料";
      modal.querySelector("#matVersion").value = "v1";
      modal.querySelector("#matTitle").value = "";
      modal.querySelector("#matUrl").value = "";
      modal.querySelector("#matDate").value = new Date().toISOString().slice(0,10);
      modal.querySelector("#matNote").value = "";
      modal.classList.add("open");
    }
    window.openMaterialModal = openMaterialModal;

    function closeMaterialModal(){
      document.getElementById("matModal").classList.remove("open");
    }
    window.closeMaterialModal = closeMaterialModal;

    function submitMaterial(){
      var modal = document.getElementById("matModal");
      var id = modal.dataset.id;
      var stage = modal.dataset.stage;
      var item = {
        version: modal.querySelector("#matVersion").value.trim() || "v1",
        title: modal.querySelector("#matTitle").value.trim() || "未命名资料",
        url: modal.querySelector("#matUrl").value.trim(),
        date: modal.querySelector("#matDate").value.trim(),
        note: modal.querySelector("#matNote").value.trim()
      };
      if(!item.url){
        alert("请填写资料链接（飞书云盘链接）");
        return;
      }
      saveLocalMaterial(id, stage, item);
      closeMaterialModal();
      // 刷新当前展开行的时间轴
      if(openedRows.has(id)){
        var detail = document.getElementById('detail-' + id);
        if(detail){
          detail.remove();
          renderDetail(id);
        }
      }
    }
    window.submitMaterial = submitMaterial;

    function exportLocalMaterials(){
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("training-materials-")===0){
          var parts = k.replace("training-materials-","").split("-");
          var stage = parts.pop();
          var id = parts.join("-");
          if(!out[id]) out[id] = {};
          out[id][stage] = JSON.parse(localStorage.getItem(k));
        }
      }
      var json = JSON.stringify(out, null, 2);
      var textarea = document.getElementById("exportBox");
      textarea.value = "// 将以下内容贴入 assets/js/data/student-materials.js 的对应成员 stages 下，\n// 即可让所有人看到本地添加的材料。\n" + json;
      textarea.parentElement.parentElement.classList.add("open");
      textarea.select();
    }
    window.exportLocalMaterials = exportLocalMaterials;

    function closeExportBox(){
      document.getElementById("exportBox").parentElement.parentElement.classList.remove("open");
    }
    window.closeExportBox = closeExportBox;

    // ===== 手动设置阶段状态 =====
    function openStageModal(id, stageName){
      var s = students.find(function(x){ return x.id===id; });
      if(!s) return;
      var st = s.stages.find(function(x){ return x.name===stageName; });
      if(!st) return;
      stageModal.dataset.id = id;
      stageModal.dataset.stage = stageName;
      stageModal.querySelector(".modal-title").textContent = s.name + " · " + stageName + " · 设置状态";
      stageModal.querySelector("#stageStatus").value = st.status || "未开始";
      stageModal.querySelector("#stageActual").value = st.actual || "";
      stageModal.querySelector("#stageNote").value = st.note || "";
      stageModal.classList.add("open");
    }
    window.openStageModal = openStageModal;

    function closeStageModal(){
      document.getElementById("stageModal").classList.remove("open");
    }
    window.closeStageModal = closeStageModal;

    function saveStageOverride(id, stageName, data){
      var key = 'training-override-' + id;
      var ov = {};
      try { ov = JSON.parse(localStorage.getItem(key)) || {}; } catch(e) {}
      ov[stageName] = data;
      localStorage.setItem(key, JSON.stringify(ov));
      applyLocalOverrides();
      renderTable();
    }
    window.saveStageOverride = saveStageOverride;

    function submitStageOverride(){
      var id = stageModal.dataset.id;
      var stageName = stageModal.dataset.stage;
      var status = stageModal.querySelector("#stageStatus").value;
      var actual = stageModal.querySelector("#stageActual").value.trim();
      var note = stageModal.querySelector("#stageNote").value.trim();
      saveStageOverride(id, stageName, { status: status, actual: actual, note: note });
      closeStageModal();
    }
    window.submitStageOverride = submitStageOverride;

    function resetStageOverride(){
      var id = stageModal.dataset.id;
      var stageName = stageModal.dataset.stage;
      var key = 'training-override-' + id;
      try {
        var ov = JSON.parse(localStorage.getItem(key)) || {};
        delete ov[stageName];
        if (Object.keys(ov).length) localStorage.setItem(key, JSON.stringify(ov));
        else localStorage.removeItem(key);
      } catch(e) {}
      applyLocalOverrides();
      renderTable();
      closeStageModal();
    }
    window.resetStageOverride = resetStageOverride;

    // 导出本浏览器中设置的状态修改（管理员合并到 student-materials.js）
    function exportStageOverrides(){
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("training-override-")===0){
          var id = k.replace("training-override-","");
          out[id] = { stages: JSON.parse(localStorage.getItem(k)) };
        }
      }
      var json = JSON.stringify(out, null, 2);
      var ta = document.getElementById("exportBox");
      ta.value = "// 将以下内容追加进 assets/js/data/student-materials.js 的 studentStageOverrides：\n" +
        "Object.assign(window.DATA.studentStageOverrides || {}, " + json + ");";
      ta.parentElement.parentElement.classList.add("open");
      ta.select();
    }
    window.exportStageOverrides = exportStageOverrides;

    applyLocalOverrides();
    renderTable();
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
