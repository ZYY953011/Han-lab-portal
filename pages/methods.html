<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验方法 · 课题组管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
<script>document.documentElement.classList.add("gate-locked");</script>
</head>
<body>
  <main class="container">
    <div id="head"></div>
    <div class="toolbar">
      <input class="grow" id="kw" placeholder="搜索方法名称 / 类型 / 编写人…">
      <select id="cat"></select>
    </div>
    <div class="grid grid-2" id="list"></div>
  </main>

  <script src="../assets/js/data/methods.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    injectHeader("实验方法");
    document.getElementById("head").innerHTML = pageHead(
      "实验方法 / SOP", "把实验方法做成可继承、可修改、可追踪版本的知识库，避免经验随学生毕业而丢失。",
      [{name:"首页", url:"../index.html"}, {name:"实验方法"}]
    );

    // 分类下拉
    var cats = [...new Set((window.DATA.methods||[]).map(m=>m.category))];
    document.getElementById("cat").innerHTML = `<option value="">全部分类</option>` + cats.map(c=>`<option>${esc(c)}</option>`).join("");

    function card(m){
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h3 style="font-size:17px; color:var(--primary-dark);"><a href="method-detail.html?id=${esc(m.id)}">${esc(m.name)}</a></h3>
          <span class="tag">${esc(m.version)}</span>
        </div>
        <div style="color:var(--muted); font-size:13px; margin:6px 0;">${esc(m.category)} ｜ 编写：${esc(m.author)} ｜ 更新：${esc(m.updated)}</div>
        <p style="font-size:13.5px; color:#44505f;">${esc(m.purpose)}</p>
        <div style="margin-top:8px;"><a class="btn btn-sm" href="method-detail.html?id=${esc(m.id)}">查看 SOP →</a></div>
      </div>`;
    }
    function render(){
      var kw = document.getElementById("kw").value.trim().toLowerCase();
      var cat = document.getElementById("cat").value;
      var list = (window.DATA.methods||[]).filter(m=>{
        var ok1 = !kw || (m.name+m.category+m.author).toLowerCase().includes(kw);
        var ok2 = !cat || m.category===cat;
        return ok1 && ok2;
      });
      document.getElementById("list").innerHTML = list.length ? list.map(card).join("") : emptyTip("没有匹配的方法");
    }
    document.getElementById("kw").addEventListener("input", render);
    document.getElementById("cat").addEventListener("change", render);
    render();
  </script>
<script src="../assets/js/gate.js"></script>
</body>
</html>
